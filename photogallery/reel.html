<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery - HAPA GOODS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep: #060d1a;
    --navy: #0b1a2e;
    --cyan: #22d3ee;
    --cyan-bright: #67e8f9;
    --cyan-deep: #0891b2;
    --glass: rgba(148, 209, 230, 0.08);
    --glass-border: rgba(148, 224, 255, 0.2);
    --ink: #eaf6fb;
    --ink-dim: #93b3c7;
    --danger: #f87171;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family:'Inter', sans-serif;
    background: radial-gradient(circle at 15% 10%, rgba(34,211,238,0.14), transparent 45%),
                radial-gradient(circle at 85% 30%, rgba(8,145,178,0.16), transparent 50%),
                radial-gradient(circle at 50% 95%, rgba(34,211,238,0.09), transparent 55%),
                linear-gradient(180deg, var(--navy-deep), var(--navy) 45%, var(--navy-deep));
    color: var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding: 40px 0;
  }

  .orb{ position:fixed; border-radius:50%; filter:blur(70px); pointer-events:none; opacity:.45; z-index:0; }
  .orb.one{ width:420px; height:420px; background:radial-gradient(circle, rgba(34,211,238,.35), transparent 70%); top:-140px; left:-120px; }
  .orb.two{ width:360px; height:360px; background:radial-gradient(circle, rgba(103,232,249,.25), transparent 70%); bottom:-120px; right:-100px; }

  header{
    text-align:center;
    z-index:2;
    margin-bottom: 30px;
    padding: 0 6vw;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--cyan-bright);
    background:var(--glass); border:1px solid var(--glass-border);
    backdrop-filter: blur(12px);
    padding:6px 15px; border-radius:999px; margin-bottom:20px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: clamp(2rem, 4.6vw, 3.2rem);
    letter-spacing:-0.02em;
    background: linear-gradient(120deg, #fff 10%, var(--cyan-bright) 55%, var(--cyan-deep) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .toolbar{
    z-index:2;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom: 26px;
  }
  .btn{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:13px;
    display:inline-flex; align-items:center; gap:8px;
    padding:11px 20px;
    border-radius:999px;
    border:1px solid var(--glass-border);
    background: var(--glass);
    color: var(--ink);
    cursor:pointer;
    text-decoration:none;
    backdrop-filter: blur(12px);
    transition: all .25s ease;
  }
  .btn:hover{
    color:#04222c;
    background: linear-gradient(120deg, var(--cyan-bright), var(--cyan-deep));
    border-color: transparent;
    box-shadow: 0 0 26px rgba(34,211,238,.35);
  }
  .btn.ghost:hover{
    color: var(--ink);
    background: rgba(148,224,255,0.14);
    box-shadow:none;
  }

  .status-line{
    z-index:2;
    font-size:12.5px;
    color: var(--ink-dim);
    margin-bottom: 18px;
    min-height: 16px;
    text-align:center;
  }
  .status-line.err{ color: var(--danger); }

  .stage{
    position:relative;
    width:100%;
    max-width:1200px;
    height:420px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
    perspective: 1400px;
  }

  .track{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .empty-state{
    text-align:center;
    color: var(--ink-dim);
    font-size:14px;
    z-index:2;
    max-width:320px;
    line-height:1.6;
  }

  .card{
    position:absolute;
    width:340px;
    height:400px;
    border-radius: 22px;
    overflow:hidden;
    cursor:pointer;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    transition: transform .55s cubic-bezier(.22,.9,.28,1), opacity .55s ease, filter .55s ease;
  }

  .card img{
    width:100%; height:100%; object-fit:cover;
    display:block;
    background: rgba(148,224,255,0.06);
    transition: transform .5s cubic-bezier(.22,.9,.28,1);
  }
  .card.pos-0:hover img{ transform: scale(1.04); }

  .card-actions{
    position:absolute; top:14px; right:14px;
    display:flex; gap:8px;
    opacity:0;
    transition: opacity .3s ease;
    z-index:2;
  }
  .card.pos-0 .card-actions{ opacity:1; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%;
    background: rgba(6,15,26,0.6);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(8px);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    text-decoration:none;
    font-size:14px;
    cursor:pointer;
    transition: all .2s ease;
  }
  .icon-btn:hover{
    background: var(--cyan-bright);
    color:#04222c;
  }

  /* fullscreen expand overlay -- shows on hover over the active (front) card */
  .expand-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(6,13,26,0);
    opacity:0;
    transition: opacity .3s ease, background .3s ease;
    z-index:3;
  }
  .card.pos-0:hover .expand-overlay{
    opacity:1;
    background: rgba(6,13,26,0.28);
  }
  .expand-btn{
    width:52px; height:52px; border-radius:50%;
    background: rgba(6,15,26,0.65);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(10px);
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    cursor:pointer;
    transform: scale(.85);
    transition: transform .25s cubic-bezier(.22,.9,.28,1), background .2s ease, color .2s ease;
  }
  .card.pos-0:hover .expand-btn{ transform: scale(1); }
  .expand-btn:hover{
    background: var(--cyan-bright);
    color:#04222c;
    box-shadow: 0 0 26px rgba(34,211,238,.45);
  }
  .expand-btn svg{ width:22px; height:22px; }

  .card::after{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(6,13,26,0) 55%, rgba(6,13,26,0.55));
    opacity:0;
    transition: opacity .5s ease;
    pointer-events:none;
  }

  .card.pos-0{ transform: translateX(0) translateZ(0) rotateY(0deg) scale(1); z-index:5; filter: none; }
  .card.pos--1{ transform: translateX(-230px) translateZ(-120px) rotateY(28deg) scale(.86); z-index:4; filter: brightness(.7) saturate(.85); }
  .card.pos-1{ transform: translateX(230px) translateZ(-120px) rotateY(-28deg) scale(.86); z-index:4; filter: brightness(.7) saturate(.85); }
  .card.pos--2{ transform: translateX(-420px) translateZ(-260px) rotateY(34deg) scale(.72); z-index:3; filter: brightness(.5) saturate(.7); }
  .card.pos-2{ transform: translateX(420px) translateZ(-260px) rotateY(-34deg) scale(.72); z-index:3; filter: brightness(.5) saturate(.7); }
  .card.pos-far{ transform: translateX(0) translateZ(-400px) scale(.5); opacity:0; z-index:1; pointer-events:none; }

  .card:not(.pos-0)::after{ opacity:1; }

  .card-caption{
    position:absolute; left:18px; right:18px; bottom:16px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    display:flex;
    justify-content:center;
    text-align:center;
    opacity:0;
    transform: translateY(6px);
    transition: all .4s ease;
    z-index:2;
    pointer-events:none;
  }
  .card-caption .view{
    background: var(--navy);
    color: var(--cyan);
    padding:8px 18px;
    border-radius:10px;
    border:1px solid var(--glass-border);
  }
  .card.pos-0 .card-caption{ opacity:1; transform:translateY(0); }

  .nav{
    display:flex; gap:16px;
    margin-top: 40px;
    z-index:2;
  }
  .nav button{
    width:48px; height:48px;
    border-radius:50%;
    background: var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(12px);
    color: var(--ink);
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: all .25s ease;
  }
  .nav button:hover{
    color:#04222c;
    background: linear-gradient(120deg, var(--cyan-bright), var(--cyan-deep));
    border-color: transparent;
    box-shadow: 0 0 26px rgba(34,211,238,.45);
  }

  .dots{
    display:flex; gap:8px;
    margin-top:22px;
    z-index:2;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background: rgba(148,224,255,0.3);
    transition: all .3s ease;
    cursor:pointer;
  }
  .dot.active{ background: var(--cyan-bright); width:22px; border-radius:4px; box-shadow: 0 0 12px rgba(34,211,238,.6); }

  /* ============== FULLSCREEN LIGHTBOX ============== */
  .lightbox{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(3,7,15,0.88);
    backdrop-filter: blur(6px);
    opacity:0;
    visibility:hidden;
    transition: opacity .35s ease, visibility 0s linear .35s;
    padding: 40px;
  }
  .lightbox.open{
    opacity:1;
    visibility:visible;
    transition: opacity .35s ease;
  }
  .lightbox-frame{
    position:relative;
    max-width:min(92vw, 1100px);
    max-height:88vh;
    transform: scale(.92);
    transition: transform .35s cubic-bezier(.22,.9,.28,1);
  }
  .lightbox.open .lightbox-frame{ transform: scale(1); }
  .lightbox-frame img{
    display:block;
    max-width:min(92vw, 1100px);
    max-height:88vh;
    width:auto; height:auto;
    border-radius:16px;
    box-shadow: 0 30px 90px rgba(0,0,0,0.6);
    border:1px solid var(--glass-border);
  }
  .lightbox-caption{
    text-align:center;
    margin-top:16px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:15px;
    color: var(--cyan-bright);
  }
  .lightbox-close{
    position:absolute;
    top:-18px; right:-18px;
    width:44px; height:44px;
    border-radius:50%;
    background: linear-gradient(120deg, var(--cyan-bright), var(--cyan-deep));
    border:1px solid var(--glass-border);
    color:#04222c;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .lightbox-close:hover{
    transform: scale(1.08);
    box-shadow: 0 0 26px rgba(34,211,238,.5);
  }
  .lightbox-close svg{ width:18px; height:18px; }

  @media (max-width: 760px){
    .stage{ height:340px; }
    .card{ width:250px; height:310px; }
    .card.pos--1{ transform: translateX(-140px) translateZ(-120px) rotateY(28deg) scale(.8); }
    .card.pos-1{ transform: translateX(140px) translateZ(-120px) rotateY(-28deg) scale(.8); }
    .card.pos--2, .card.pos-2{ opacity:0; pointer-events:none; }
    .lightbox-close{ top:-14px; right:0; }
  }
</style>
</head>
<body>

<div class="orb one"></div>
<div class="orb two"></div>

<header>
  <span class="eyebrow">HAPA GOODS - RAJKOT DIVISION (W.R.)</span>
  <h1>Photo Gallery</h1>
</header>

<div class="toolbar">
  <button class="btn ghost" id="refreshBtn">&#8635; Refresh</button>
</div>

<div class="status-line" id="statusLine"></div>

<div class="stage">
  <div class="track" id="track"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    No photos yet. Click "Upload Photo" to add your first photo.
  </div>
</div>

<div class="nav">
  <button id="prevBtn" aria-label="Previous">&#8592;</button>
  <button id="nextBtn" aria-label="Next">&#8594;</button>
</div>

<div class="dots" id="dots"></div>

<!-- Fullscreen lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-frame">
    <button class="lightbox-close" id="lightboxClose" title="Minimize" aria-label="Minimize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<script>
  // ============================================================
  // CONFIG -- paste your Google Apps Script Web App URL here
  // (the same URL must also be used in upload.html)
  // ============================================================
  const CONFIG = {
    SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbxt2Er5ruBQJKJaxUqnuBxl8GhX4hZsDRYEIGKnHlapTUZYr06IjvQeD_T8rS7-tTj-KQ/exec'
  };

  let photos = [];
  let current = 0;

  const track = document.getElementById('track');
  const dotsWrap = document.getElementById('dots');
  const emptyState = document.getElementById('emptyState');
  const statusLine = document.getElementById('statusLine');

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCaption = document.getElementById('lightboxCaption');
  const lightboxClose = document.getElementById('lightboxClose');

  function setStatus(msg, isErr){
    statusLine.textContent = msg || '';
    statusLine.classList.toggle('err', !!isErr);
  }

  function isConfigured(){
    return CONFIG.SCRIPT_URL && CONFIG.SCRIPT_URL.indexOf('PASTE_YOUR') === -1;
  }

  async function loadPhotos(){
    if (!isConfigured()){
      setStatus('CONFIG.SCRIPT_URL is not set -- deploy your Apps Script and paste the URL here.', true);
      photos = [];
      build();
      return;
    }
    setStatus('Loading photos...');
    try{
      const res = await fetch(CONFIG.SCRIPT_URL + '?action=list');
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      photos = data.photos || [];
      setStatus('');
      current = 0;
      build();
    }catch(err){
      setStatus('Could not load photos: ' + err.message, true);
      photos = [];
      build();
    }
  }

  function build(){
    track.innerHTML = '';
    emptyState.style.display = photos.length ? 'none' : 'flex';

    photos.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = i;
      card.innerHTML =
        '<img src="' + p.viewUrl + '" alt="' + escapeHtml(p.caption) + '" loading="lazy">' +
        '<div class="card-actions">' +
          '<a class="icon-btn" href="' + p.downloadUrl + '" title="Download" target="_blank" rel="noopener">&#11015;</a>' +
        '</div>' +
        '<div class="expand-overlay">' +
          '<button class="expand-btn" title="View fullscreen" aria-label="View fullscreen">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="card-caption">' +
          '<div class="view">' + escapeHtml(p.caption) + '</div>' +
        '</div>';

      card.addEventListener('click', (e) => {
        if (e.target.closest('.card-actions')) return;
        if (e.target.closest('.expand-overlay')) return;
        current = i; update();
      });

      card.querySelector('.expand-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        current = i; update();
        openLightbox(p);
      });

      track.appendChild(card);
    });

    dotsWrap.innerHTML = '';
    photos.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.addEventListener('click', () => { current = i; update(); });
      dotsWrap.appendChild(dot);
    });

    update();
  }

  function openLightbox(photo){
    lightboxImg.src = photo.viewUrl;
    lightboxImg.alt = photo.caption || '';
    lightboxCaption.textContent = photo.caption || '';
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox();
  });

  function update(){
    const cards = track.querySelectorAll('.card');
    const n = photos.length;
    cards.forEach((card, i) => {
      let diff = i - current;
      if (diff > n/2) diff -= n;
      if (diff < -n/2) diff += n;

      card.className = 'card';
      if (diff === 0) card.classList.add('pos-0');
      else if (diff === -1) card.classList.add('pos--1');
      else if (diff === 1) card.classList.add('pos-1');
      else if (diff === -2) card.classList.add('pos--2');
      else if (diff === 2) card.classList.add('pos-2');
      else card.classList.add('pos-far');
    });

    document.querySelectorAll('.dot').forEach((d, i) => {
      d.classList.toggle('active', i === current);
    });
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    if (!photos.length) return;
    current = (current - 1 + photos.length) % photos.length;
    update();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (!photos.length) return;
    current = (current + 1) % photos.length;
    update();
  });
  document.addEventListener('keydown', (e) => {
    if (lightbox.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
    if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  });
  document.getElementById('refreshBtn').addEventListener('click', loadPhotos);

  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  loadPhotos();
</script>

</body>
</html>
