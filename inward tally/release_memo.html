<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Release Memo - HAPA Goods Shed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    :root{
        --navy-900:#03192e;
        --navy-800:#062a4a;
        --navy-700:#0a3a63;
        --cyan-300:#7fe9fb;
        --cyan-400:#22d3ee;
        --text:#dcf2f9;
        --muted:#8fb4c7;
        --border:rgba(34,211,238,0.25);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, var(--navy-700) 0%, var(--navy-900) 60%);
        color: var(--text);
        min-height: 100vh;
        padding: 18px;
    }
    .page-title{
        text-align:center; text-transform: uppercase; letter-spacing: 2px;
        font-size: 26px; font-weight: 700; color: var(--cyan-300);
        text-shadow: 0 0 18px rgba(34,211,238,0.35); margin: 6px 0 20px;
    }
    .card{
        max-width: 1000px; margin: 0 auto 18px;
        background: rgba(6, 26, 46, 0.85); border: 1px solid var(--border);
        border-radius: 12px; padding: 16px 18px; backdrop-filter: blur(10px);
    }
    #resultsCard{ max-width: 1180px; width: fit-content; }

    .filter-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; align-items:end; }
    .field{ display:flex; flex-direction:column; gap:5px; font-size:12px; }
    .field label{ font-weight:700; color: var(--cyan-300); }
    input, select, button{
        background: var(--navy-800); color: var(--text); border: 1px solid var(--border);
        border-radius: 8px; padding: 9px 12px; font-size: 13px; outline: none; width: 100%;
    }
    button{
        cursor: pointer; background: linear-gradient(100deg, var(--navy-700) 0%, var(--navy-800) 100%);
        color: var(--cyan-300); font-weight: 600; border-color: rgba(34,211,238,0.4); transition: background 0.2s ease;
    }
    button:hover{ background: var(--navy-700); }
    #submitBtn{ width:auto; padding: 8px 22px; font-size: 13px; align-self:flex-start; }
    button:disabled{ opacity: 0.5; cursor: not-allowed; }

    /* -- Date filter: text input (always DD/MM/YYYY) + native date-picker triggered by a cyan icon -- */
    .date-input-wrap{ position:relative; display:flex; align-items:center; }
    .date-input-wrap input[type="text"]{ padding-right: 36px; }
    .hidden-date-picker{
        position:absolute; left:0; top:0; width:1px; height:1px;
        opacity:0; pointer-events:none; border:0; padding:0;
    }
    .date-icon-btn{
        position:absolute; right:3px; top:50%; transform:translateY(-50%);
        width:28px; height:28px; padding:0; display:flex; align-items:center; justify-content:center;
        background:transparent; border:none; width:28px;
    }
    .date-icon-btn:hover{ background: rgba(34,211,238,0.12); border-radius:6px; }
    .date-icon-btn svg{ width:18px; height:18px; pointer-events:none; }
    .date-icon-btn svg *{ stroke: var(--cyan-400); }

    @media (max-width: 600px){
        .page-title{ font-size: 20px; }
        .card{ padding: 14px 12px; }
        .filter-grid{ grid-template-columns: 1fr 1fr; gap: 10px; }
        #submitBtn{ width:100%; align-self:stretch; }
    }

    /* Themed popup overlay, reused for the Email modal and the Success modal --
       same dark navy / glowing cyan look as the rest of this page. */
    .wsm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2,10,20,0.72);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
    }
    .wsm-box {
        background: linear-gradient(160deg, var(--navy-900), var(--navy-800) 60%, var(--navy-700));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px 22px;
        max-width: 320px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 50px rgba(0,0,0,0.6), 0 0 40px rgba(34,211,238,0.15);
    }
    .wsm-icon { font-size: 32px; color: var(--cyan-400); text-shadow: 0 0 16px rgba(34,211,238,0.6); margin-bottom: 8px; }
    .wsm-title {
        color: var(--cyan-300);
        font-weight: 800;
        letter-spacing: 1.8px;
        font-size: 14px;
        margin-bottom: 14px;
        text-transform: uppercase;
        text-shadow: 0 0 18px rgba(34,211,238,0.5);
    }
    .wsm-label { font-size: 12.5px; text-align: left; margin-bottom: 6px; color: var(--text); }
    .wsm-input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(6,26,46,0.6);
        color: var(--text);
        font-size: 13px;
        outline: none;
        margin-bottom: 12px;
    }
    .wsm-input::placeholder { color: var(--muted); }
    .wsm-input:focus { border-color: var(--cyan-400); box-shadow: 0 0 10px rgba(34,211,238,0.35); }
    .wsm-error { min-height: 16px; font-size: 12px; color: #ff8f8f; margin: 0 0 6px; text-align: left; }
    .wsm-msg { font-size: 14px; margin-bottom: 18px; color: var(--text); line-height: 1.5; }
    .wsm-btns { display: flex; gap: 12px; justify-content: center; margin-top: 6px; }
    .wsm-btn {
        padding: 10px 28px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        letter-spacing: 0.5px;
    }
    .wsm-btn-primary { background: linear-gradient(135deg, var(--cyan-400), #0090c8); color: #001824; box-shadow: 0 0 16px rgba(34,211,238,0.4); }
    .wsm-btn-primary:hover { box-shadow: 0 0 24px rgba(34,211,238,0.55); }
    .wsm-btn-cancel { background: linear-gradient(135deg, #5a6b7a, #33414d); color: var(--text); box-shadow: none; }
    .wsm-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

    .status-msg{ max-width: 1000px; margin: 0 auto 12px; font-size: 13px; color: var(--muted); text-align:center; }
    .status-msg.error{ color: #ff9b9b; }

    /* ===== Results table ===== */
    .table-wrap{ overflow-x:auto; }
    table.results-table{ width:auto; max-width:100%; border-collapse: collapse; font-size:14px; table-layout: auto; }
    table.results-table th, table.results-table td{
        border: 1px solid var(--border);
        padding: 9px 12px;
        text-align:center;
        white-space: nowrap;
    }
    table.results-table th{ background: rgba(34,211,238,0.1); color: var(--cyan-300); line-height:1.3; text-transform: uppercase; letter-spacing: 0.3px; }
    table.results-table tr:hover td{ background: rgba(34,211,238,0.06); }
    table.results-table th.col-wgn, table.results-table td.col-wgn{ width: auto; }
    table.results-table th.col-pdf, table.results-table td.col-pdf{ width: auto; }
    table.results-table th.col-sr{ width: auto; }

    @media (max-width: 700px){
        table.results-table{ font-size:12.5px; }
        table.results-table th, table.results-table td{ padding: 7px 8px; }
    }
    /* Progressive auto-shrink (applied by JS only if the table would otherwise overflow
       and need a horizontal scrollbar) — each level is smaller than the last. */
    table.results-table.shrink-1{ font-size:12px; }
    table.results-table.shrink-1 th, table.results-table.shrink-1 td{ padding:6px 7px; }
    table.results-table.shrink-2{ font-size:10.5px; }
    table.results-table.shrink-2 th, table.results-table.shrink-2 td{ padding:5px 5px; }
    table.results-table.shrink-3{ font-size:9px; }
    table.results-table.shrink-3 th, table.results-table.shrink-3 td{ padding:4px 3px; }
    table.results-table.shrink-4{ font-size:7.5px; }
    table.results-table.shrink-4 th, table.results-table.shrink-4 td{ padding:2px 2px; }

    .gen-row-btn{ width: 26px; height: 26px; padding: 0; display:inline-flex; align-items:center; justify-content:center; border-radius: 6px; }
    .gen-row-btn svg{ pointer-events:none; width:14px; height:14px; }

    /* ===== A4 sheet: TWO identical copies, split exactly at center, dashed cut line ===== */
    #statementWrap{ display:none; }
    .a4-actions{ max-width: 210mm; margin: 12px auto 24px; text-align:center; }
    .a4-actions button{ width:auto; display:inline-block; padding: 9px 20px; }
    .a4-page{
        width: 210mm; height: 297mm; margin: 0 auto 24px; background:#ffffff; color:#000000;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        font-family: 'Cambria', 'Georgia', 'Times New Roman', serif;
        display:flex; flex-direction:column;
    }
    .memo-copy{ height: 148.5mm; padding: 10mm 14mm; box-sizing:border-box; display:flex; flex-direction:column; text-transform: uppercase; }
    .cut-line{
        position:relative; height:0; border-top: 2px dashed #444; margin: 0;
    }
    .cut-line span{
        position:absolute; top:-9px; left:50%; transform:translateX(-50%);
        background:#fff; padding:0 10px; font-size:10px; letter-spacing:2px; color:#444;
    }
    .copy-tag{
        position:absolute; top:6mm; right:14mm; font-size:9px; letter-spacing:1px;
        text-transform:uppercase; color:#000; border:1px solid #000; border-radius:3px; padding:2px 6px;
    }
    .memo-copy{ position:relative; }
    .memo-title{
        text-align:center; text-transform:uppercase; font-weight:800; font-size:16px;
        letter-spacing:2px; border-top:2px double #000; border-bottom:2px double #000;
        padding:6px 4px; margin:0 0 10px; color:#000;
    }
    .memo-row{
        display:flex; gap: 20px; font-size:12.5px; padding:6px 8px; margin-bottom:8px;
        background:#ffffff; border:1px solid #000; border-radius:0;
    }
    .memo-row .f{ flex:1; display:flex; gap:6px; align-items:baseline; }
    .memo-row .f .lbl{ font-weight:700; white-space:nowrap; color:#000; }
    .memo-row .f .val{ flex:1; border-bottom:1px solid #000; min-height:14px; font-weight:700; padding:0 2px; color:#000; }
    .memo-num{ font-weight:800; margin-right:4px; color:#000; }
    .wagon-table-wrap{ margin: 4px 0 8px; }
    .wagon-cap{ font-size:12px; font-weight:800; margin-bottom:5px; color:#000; }
    table.wagon-mini{ width:100%; border-collapse:collapse; font-size:12px; }
    table.wagon-mini th, table.wagon-mini td{ border:1px solid #000; padding:6px 6px; text-align:center; color:#000; background:#fff; }
    table.wagon-mini th{ font-weight:800; letter-spacing:0.3px; }
    table.wagon-mini td{ font-weight:700; }
    .remarks{ font-size:11.5px; margin:6px 0 0; line-height:1.6; background:#ffffff; border:1px solid #000; border-radius:0; padding:7px 26px 7px 8px; color:#000; position:relative; }
    .remarks .rlabel{ font-weight:800; }
    .remarks-edit-btn{
        position:absolute; top:5px; right:5px; width:18px; height:18px; padding:0;
        display:inline-flex; align-items:center; justify-content:center;
        border:1px solid #000; border-radius:4px; background:#fff; cursor:pointer;
    }
    .remarks-edit-btn svg{ width:11px; height:11px; pointer-events:none; }
    .remarks-edit-btn:hover{ background:#f0f0f0; }
    /* Pencil icon is only for on-screen editing -- never appears in the printed
       memo or in the PDF/Email screenshot capture. */
    .pdf-capturing .remarks-edit-btn{ display:none !important; }
    .memo-footer{ margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; padding-top:10px; gap:10px; }
    .sign-space{ text-align:center; font-size:10.5px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; color:#000; }
    .sig-gap{ height:24px; }
    /* -- Signature stamp: identical to Demmurage Bill's blue rubber-stamp look, the ONLY colour exception -- */
    .stamp-box{
        display:inline-block;
        border: 2px solid rgba(19,56,140,0.8);
        border-radius: 6px;
        padding: 6px 16px 5px;
        transform: rotate(-3deg);
        color: rgba(19,56,140,0.85);
        white-space: nowrap;
    }
    .stamp-box .hi{ font-weight:700; margin: 0; line-height: 1.5; white-space: nowrap; }
    .stamp-box .en{ font-weight:700; margin: 0; line-height: 1.5; letter-spacing: 0.3px; white-space: nowrap; }
    .sign-cap{ border-top:1px solid #000; padding-top:3px; min-width:110px; font-weight:800; letter-spacing:0.3px; font-size:10px; color:#000; }

    @page{ size: A4; margin: 0; }
    @media print{
        body{ background:#fff !important; padding:0; }
        .page-title, .card, .status-msg, .a4-actions{ display:none !important; }
        #statementWrap{ display:block !important; }
        .a4-page{ box-shadow:none; margin:0; }
        .remarks-edit-btn{ display:none !important; }
    }
</style>
</head>
<body>

    <div class="page-title">Release Memo</div>

    <!-- ===== Search / Filter (same as Demmurage Bill) ===== -->
    <div class="card" id="filterCard">
        <div class="filter-grid">
            <div class="field">
                <label for="stationFrom">STATION FROM</label>
                <input list="stationList" id="stationFrom" placeholder="Type or select station">
                <datalist id="stationList"></datalist>
            </div>
            <div class="field">
                <label for="consigneeCode">CONSIGNEE CODE</label>
                <input list="consigneeList" id="consigneeCode" placeholder="Type or select consignee">
                <datalist id="consigneeList"></datalist>
            </div>
            <div class="field">
                <label for="fromDate">RR DATE (FROM)</label>
                <div class="date-input-wrap">
                    <input type="text" id="fromDate" placeholder="DD/MM/YYYY" maxlength="10" inputmode="numeric" autocomplete="off">
                    <input type="date" id="fromDatePicker" class="hidden-date-picker" tabindex="-1" aria-hidden="true">
                    <button type="button" class="date-icon-btn" id="fromDateIconBtn" aria-label="Pick from date">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3.5" y="5" width="17" height="15.5" rx="2" stroke-width="1.6"/>
                            <path d="M3.5 9.5H20.5" stroke-width="1.6"/>
                            <path d="M8 3V6" stroke-width="1.6" stroke-linecap="round"/>
                            <path d="M16 3V6" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="field">
                <label for="toDate">RR DATE (TO)</label>
                <div class="date-input-wrap">
                    <input type="text" id="toDate" placeholder="DD/MM/YYYY" maxlength="10" inputmode="numeric" autocomplete="off">
                    <input type="date" id="toDatePicker" class="hidden-date-picker" tabindex="-1" aria-hidden="true">
                    <button type="button" class="date-icon-btn" id="toDateIconBtn" aria-label="Pick to date">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3.5" y="5" width="17" height="15.5" rx="2" stroke-width="1.6"/>
                            <path d="M3.5 9.5H20.5" stroke-width="1.6"/>
                            <path d="M8 3V6" stroke-width="1.6" stroke-linecap="round"/>
                            <path d="M16 3V6" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="field">
                <label>&nbsp;</label>
                <button id="submitBtn" disabled>SUBMIT</button>
            </div>
        </div>
    </div>

    <div class="status-msg" id="statusMsg">Data is Loading... Please Wait</div>

    <!-- ===== Results (Demmurage Bill format, minus Demmurage Hrs. / Amt. columns) ===== -->
    <div class="card" id="resultsCard" style="display:none;">
        <div class="table-wrap">
            <table class="results-table">
                <thead>
                    <tr>
                        <th class="col-sr">Sr. No.</th>
                        <th>From</th>
                        <th>To</th>
                        <th class="col-wgn">WGN.</th>
                        <th>RR No.</th>
                        <th>RR Date</th>
                        <th>CMDT</th>
                        <th>CNSG</th>
                        <th>Placement<br>Date &amp; Time</th>
                        <th>Release<br>Date &amp; Time</th>
                        <th class="col-pdf">PDF</th>
                        <th class="col-pdf">EXCEL</th>
                        <th class="col-pdf">PRINT</th>
                        <th class="col-pdf">E-MAIL</th>
                    </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ===== A4 Memo (2 copies) — format unchanged, as it was ===== -->
    <div id="statementWrap">
        <div class="a4-page" id="a4Page">
            <div class="memo-copy" id="copy1">
                <div class="copy-tag">CGS-HAPA Copy</div>
            </div>
            <div class="cut-line"><span>&#9986; CUT HERE &#9986;</span></div>
            <div class="memo-copy" id="copy2">
                <div class="copy-tag">CYM-HAPA Copy</div>
            </div>
        </div>
        <div class="a4-actions">
            <button id="clearStatementBtn" type="button">CLEAR</button>
        </div>
    </div>

<!-- Email popup: takes the recipient's email, generates the PDF, and sends it
     via the Apps Script backend (same flow as Demmurage Bill). -->
<div class="wsm-overlay" id="emailOverlay">
    <div class="wsm-box">
        <div class="wsm-icon">&#9993;</div>
        <div class="wsm-title">Send Email</div>
        <div class="wsm-label">To (email address) :</div>
        <input type="email" id="emailToInput" class="wsm-input" placeholder="example@gmail.com" autocomplete="off">
        <div class="wsm-label">Password :</div>
        <input type="password" id="emailPasswordInput" class="wsm-input" placeholder="Enter password" autocomplete="off">
        <div id="emailModalMsg" class="wsm-error"></div>
        <div class="wsm-btns">
            <button class="wsm-btn wsm-btn-cancel" id="emailCancelBtn" type="button">Cancel</button>
            <button class="wsm-btn wsm-btn-primary" id="emailSendBtn" type="button">Send</button>
        </div>
    </div>
</div>

<!-- Success popup, shown once the email has been sent -->
<div class="wsm-overlay" id="successOverlay">
    <div class="wsm-box">
        <div class="wsm-icon">&#127881;</div>
        <div class="wsm-title">Success</div>
        <div class="wsm-msg" id="successMsg"></div>
        <button class="wsm-btn wsm-btn-primary" id="successOkBtn" type="button">OK</button>
    </div>
</div>

<script>
    // Live rake feed (Google Apps Script) — same single-call listAll source used by
    // Demmurage Bill / Print Wagon Summary. Response shape: { records: [...] }, one object per rake.
    var SHEET_ID = "1kZF1pTmCnMcjMKwzLvxU6CMoyqkiBEGd2lWOYXSxo64";
    var SHEET_NAME = "iw_rake_data";
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2hFOjiIlfK375_uBK3EQJ-_4KUwflq8AV3gmJtFjDGt-b-KhDm7avaq040OrxonTdTw/exec"
        + "?action=listAll&sheetId=" + encodeURIComponent(SHEET_ID) + "&sheetName=" + encodeURIComponent(SHEET_NAME);
    var TO_STATION = "HAPA"; // fallback only — real destination normally comes from d.stationTo

    var statusMsg = document.getElementById('statusMsg');
    var resultsCard = document.getElementById('resultsCard');
    var resultsBody = document.getElementById('resultsBody');
    var stationList = document.getElementById('stationList');
    var consigneeList = document.getElementById('consigneeList');
    var statementWrap = document.getElementById('statementWrap');

    var allRecords = [];      // { id, data }
    var filteredRecords = [];

    // Manually added Remarks "Point 3" per rake, keyed by rec.id -- persists for
    // the session so both copies (and re-opening the same rake) stay in sync.
    var extraRemarksStore = {};

    function escapeHtml(str){
        return String(str == null ? "" : str)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // Accepts a bare array, a {records:[...]}/{data:[...]}/{rows:[...]}/{result:[...]} wrapper,
    // or a single rake object -- normalizes to an array either way.
    function extractArray(json){
        if (Array.isArray(json)) return json;
        if (json && Array.isArray(json.records)) return json.records;
        if (json && Array.isArray(json.data)) return json.data;
        if (json && Array.isArray(json.rows)) return json.rows;
        if (json && Array.isArray(json.result)) return json.result;
        if (json && typeof json === "object" && Object.prototype.hasOwnProperty.call(json, "rakeId")) return [json];
        return [];
    }
    function setStatus(msg, isError){
        statusMsg.textContent = msg || "";
        statusMsg.className = "status-msg" + (isError ? " error" : "");
    }
    function parseDMY(str){
        if (!str) return null;
        var parts = str.split("/");
        if (parts.length !== 3) return null;
        var d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
        if (!d || !m || !y) return null;
        return new Date(y, m - 1, d);
    }
    function parseInputDMY(str){
        if (!str) return null;
        str = str.trim();
        var parts = str.split(/[\/\-\.]/);
        if (parts.length !== 3) return null;
        var d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
        if (!d || !m || !y) return null;
        return new Date(y, m - 1, d);
    }
    // dd/mm/yyyy or dd-mm-yyyy or dd.mm.yyyy string -> Date object (or null)
    function parseAnyDMY(raw){
        if (!raw) return null;
        var parts = String(raw).trim().split(/[\/\-\.]/);
        if (parts.length !== 3) return null;
        var d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
        if (!d || !m || !y) return null;
        return new Date(y, m - 1, d);
    }
    function pad2(n){ return n < 10 ? "0" + n : "" + n; }
    function formatDMY(dt){ return pad2(dt.getDate()) + "/" + pad2(dt.getMonth() + 1) + "/" + dt.getFullYear(); }
    // Same as above but hyphen-separated (DD-MM-YYYY) -- used for file names,
    // since "/" is not a valid character in a file name.
    function formatDateForFileName(raw){
        var d = parseAnyDMY(raw);
        return d ? (pad2(d.getDate()) + "-" + pad2(d.getMonth() + 1) + "-" + d.getFullYear()) : (raw || "-");
    }
    // Whatever format a date arrives in from the sheet (ISO, D/M/YYYY, etc.) — always show DD/MM/YYYY,
    // same on mobile and PC (we never use native <input type="date">, only plain text).
    function toDMY(str){
        if (!str) return "";
        str = str.toString().trim();
        var m = str.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
        if (m) return pad2(parseInt(m[1], 10)) + "/" + pad2(parseInt(m[2], 10)) + "/" + m[3];
        m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) return pad2(parseInt(m[3], 10)) + "/" + pad2(parseInt(m[2], 10)) + "/" + m[1];
        var d = new Date(str);
        if (!isNaN(d.getTime())) return formatDMY(d);
        return str;
    }
    function pickField(obj, patterns){
        var keys = Object.keys(obj || {});
        for (var p = 0; p < patterns.length; p++){
            for (var i = 0; i < keys.length; i++){
                if (keys[i].toLowerCase().indexOf(patterns[p]) !== -1) return obj[keys[i]];
            }
        }
        return "";
    }

    // Release Date & Time as a sortable Date object (dd/mm/yyyy + HH:MM)
    function parseReleaseDateTime(d){
        var dt = parseDMY(d.releaseDate);
        if (!dt) return null;
        if (d.releaseTime){
            var tp = d.releaseTime.toString().split(":");
            var hh = parseInt(tp[0], 10) || 0, mm = parseInt(tp[1], 10) || 0;
            dt.setHours(hh, mm, 0, 0);
        }
        return dt;
    }
    // Latest Release Date & Time first, oldest last
    function sortByReleaseDesc(records){
        return records.slice().sort(function(a, b){
            var da = parseReleaseDateTime(a.data) || new Date(0);
            var db = parseReleaseDateTime(b.data) || new Date(0);
            return db - da;
        });
    }

    // Single call fetches every rake; a release memo only makes sense once a rake
    // already has placement AND release data filled in AND its STATUS is RELEASED,
    // so we filter to that subset right here (same rule as Demmurage Bill).
    function fetchAllRecords(){
        return fetch(APPS_SCRIPT_URL).then(function(r){ return r.json(); }).then(function(json){
            if (json && json.status === "error") throw new Error(json.message || "Backend error");
            var arr = extractArray(json);
            return arr.map(function(d, i){ return { id: (d.rakeId || d.rrNumber || ("rake_" + i)), data: d }; })
                .filter(function(rec){
                    var d = rec.data;
                    var isReleased = d.status && String(d.status).trim().toUpperCase() === "DELIVERED";
                    return isReleased && !!(d.placementDate && d.releaseDate);
                });
        });
    }

    // Wires a cyan calendar-icon button to a hidden native <input type="date">.
    // The visible text field always keeps/shows DD/MM/YYYY, regardless of what
    // format the browser's native picker itself uses internally.
    function wireDatePicker(textId, pickerId, btnId){
        var textInput = document.getElementById(textId);
        var pickerInput = document.getElementById(pickerId);
        var btn = document.getElementById(btnId);
        if (!textInput || !pickerInput || !btn) return;

        btn.addEventListener('click', function(){
            var d = parseInputDMY(textInput.value);
            pickerInput.value = d ? (d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate())) : "";
            if (typeof pickerInput.showPicker === 'function'){
                pickerInput.showPicker();
            } else {
                pickerInput.focus();
                pickerInput.click();
            }
        });

        pickerInput.addEventListener('change', function(){
            if (!pickerInput.value) return;
            var parts = pickerInput.value.split('-'); // yyyy-mm-dd
            textInput.value = parts[2] + "/" + parts[1] + "/" + parts[0]; // -> dd/mm/yyyy
        });
    }

    // Progressively shrinks font/padding until the results table fits its container

            if (fromD || toD){

    // ===== Memo content — format kept exactly as it was (release memo, as it is) =====

    // Wagon type breakdown from wagonSummary (JSON array saved in the sheet).
    // Classification rule (checked in this order, by prefix of the type string):
    //   first 5 chars "BCNHL"  -> bucket "BCNHL"
    //   first 6 chars "BOXNHL" -> bucket "BOXNHL"
    //   first 4 chars "BCNA"   -> bucket "BCNA"
    //   first 3 chars "BCN" but 4th char is NOT "A" -> bucket "BCN"
    //   anything else -> its own bucket, header = the type text itself
    // Last column is always TOTAL = sum of every bucket (== total wagons).
    function wagonTypeBreakdown(wagonSummary, totalFallback){
        // "wagonSummary" arrives as a JSON string like [{"RLY":"SE","TYPE":"BCNAM1","NO":"..."}].
        if (typeof wagonSummary === "string"){
            try { wagonSummary = JSON.parse(wagonSummary); } catch (e){ wagonSummary = []; }
        }
        var list = Array.isArray(wagonSummary) ? wagonSummary : [];
        var counts = {}, order = [];
        list.forEach(function(w){
            var raw = (pickField(w, ["type"]) || "").toString().trim().toUpperCase();
            var key;
            if (raw.slice(0, 5) === "BCNHL") key = "BCNHL";
            else if (raw.slice(0, 6) === "BOXNHL") key = "BOXNHL";
            else if (raw.slice(0, 4) === "BCNA") key = "BCNA";
            else if (raw.slice(0, 3) === "BCN" && raw.charAt(3) !== "A") key = "BCN";
            else key = raw || "OTHER";
            if (!(key in counts)){ counts[key] = 0; order.push(key); }
            counts[key]++;
        });
        var total = 0;
        order.forEach(function(k){ total += counts[k]; });
        if (total === 0 && totalFallback) total = parseInt(totalFallback, 10) || 0;
        return { order: order, counts: counts, total: total };
    }

    function buildWagonTable(bd){

        if (bd.order.length === 0){
            theadCells = '<th class="tot-th">TOTAL</th>';
            tdCells = '<td class="tot-cell">' + (bd.total || "-") + '</td>';
        }
        return '<table class="wagon-mini"><thead><tr>' + theadCells + '</tr></thead><tbody><tr>' + tdCells + '</tr></tbody></table>';
    }

    // Base filename shared by the PDF and Excel downloads for one rake --
    // "INV {INVOICE NO.} {STATION FROM} {STATION TO} {RR DATE} (RELEASE MEMO)",
    // e.g. "INV 01 TCLS HAPA 17-08-2026 (RELEASE MEMO)".
    function buildFileNameForRec(rec){
        var d = (rec && rec.data) ? rec.data : {};
        var inv = d.invoiceNo || '-';
        var from = d.stationFrom || '-';
        var to = d.stationTo || TO_STATION;
        var rrDate = formatDateForFileName(d.rrDate);
        return 'INV ' + inv + ' ' + from + ' ' + to + ' ' + rrDate + ' (RELEASE MEMO)';
    }

    // Builds the PDF as bytes (no save, no download) from the on-screen a4 page --
    // used by both the PDF button and the Email flow so they share one PDF source.
    // The image is always scaled to fit within a SINGLE A4 portrait page.
    function generateMemoPdfBlob(rec){
        return new Promise(function(resolve, reject){
            generateMemo(rec);
            setTimeout(function(){
                var page = document.getElementById('a4Page');
                if (!page || typeof html2canvas === 'undefined' || !window.jspdf){
                    reject(new Error('PDF library not loaded'));
                    return;
                }
                var fileName = buildFileNameForRec(rec) + '.pdf';
                page.classList.add('pdf-capturing'); // hide the Remarks pencil icon for the capture
                html2canvas(page, { scale: 3, useCORS: true, backgroundColor: '#ffffff' }).then(function(canvas){
                    page.classList.remove('pdf-capturing');
                    var imgData = canvas.toDataURL('image/jpeg', 0.98);
                    var jsPDF = window.jspdf.jsPDF;
                    var pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                    var pageW = pdf.internal.pageSize.getWidth();
                    var pageH = pdf.internal.pageSize.getHeight();
                    var imgRatio = canvas.height / canvas.width;
                    var w = pageW;
                    var h = w * imgRatio;
                    if (h > pageH){ h = pageH; w = h / imgRatio; }
                    var x = (pageW - w) / 2;
                    var y = (pageH - h) / 2;
                    pdf.addImage(imgData, 'JPEG', x, y, w, h);
                    resolve({ blob: pdf.output('blob'), fileName: fileName });
                }).catch(function(err){ page.classList.remove('pdf-capturing'); reject(err); });
            }, 60);
        });
    }

    // PDF icon click par memo screen par dikhta hain AND yahi function usse
    // seedha PDF file ke roop me download bhi kar deta hain.
    function downloadMemoPdf(rec){
        if (!rec) return;
        generateMemoPdfBlob(rec).then(function(result){
            var url = URL.createObjectURL(result.blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = result.fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
            setStatus('"' + result.fileName + '" has been saved to the default Downloads folder.');
        }).catch(function(err){
            console.error('downloadMemoPdf error:', err);
            setStatus('An error occurred while generating the PDF: ' + (err && err.message ? err.message : err), true);
        });
    }

    // Excel icon -- builds a workbook with the same memo info and wagon list as the PDF, then downloads it.
    function exportMemoExcel(rec){
        if (!rec) return;
        if (typeof XLSX === 'undefined'){
            setStatus('Failed to load Excel library -- please check your internet connection.', true);
            return;
        }
        var d = rec.data;
        var bd = wagonTypeBreakdown(d.wagonSummary, d.wagonCount);

        var wsData = [
            ['RELEASE MEMO'],
            ['HAPA Goods Shed - Rajkot Division (W.R.)'],
            [],
            ['RR NO. & DATE : ' + (d.rrNumber || '-') + '  ' + (d.rrDate || '-')],
            ['FROM STATION : ' + (d.stationFrom || '-'), '', 'TO STATION : ' + (d.stationTo || TO_STATION)],
            ['COMMODITY : ' + (d.commodityCode || '-'), '', 'NAME OF PARTY : ' + (d.consignee || '-')],
            ['PLACEMENT DATE & TIME : ' + toDMY(d.placementDate) + ' ' + (d.placementTime || '-'), '', 'RELEASE DATE & TIME : ' + toDMY(d.releaseDate) + ' ' + (d.releaseTime || '-')],
            [],
            ['NO. OF WAGONS']
        ];
        var typeHeader = bd.order.slice();
        typeHeader.push('TOTAL');
        var typeRow = bd.order.map(function(k){ return bd.counts[k]; });
        typeRow.push(bd.total || '-');
        wsData.push(typeHeader);
        wsData.push(typeRow);
        wsData.push([]);
        wsData.push(['SR.', 'RLY', 'WAGON TYPE', 'WAGON NO.']);

        var wagonSummary = d.wagonSummary;
        if (typeof wagonSummary === 'string'){
            try { wagonSummary = JSON.parse(wagonSummary); } catch (e){ wagonSummary = []; }
        }
        var list = Array.isArray(wagonSummary) ? wagonSummary : [];
        list.forEach(function(w, i){
            wsData.push([i + 1, pickField(w, ["rly"]) || '-', pickField(w, ["type"]) || '-', pickField(w, ["wgn", "wagon", "no"]) || '-']);
        });

        var ws = XLSX.utils.aoa_to_sheet(wsData);
        ws['!cols'] = [{ wch: 26 }, { wch: 14 }, { wch: 14 }, { wch: 16 }];

        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Release Memo');
        var wbArray = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        var blob = new Blob([wbArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var fileName = buildFileNameForRec(rec) + '.xlsx';

        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        setStatus('"' + fileName + '" has been saved to the default Downloads folder.');
    }

    // ---------------- Email popup (recipient input -> PDF -> Apps Script -> Gmail) ----------------
    var currentEmailRec = null;

    function openEmailModal(rec){
        if (!rec) return;
        currentEmailRec = rec;
        document.getElementById('emailToInput').value = '';
        document.getElementById('emailPasswordInput').value = '';
        document.getElementById('emailModalMsg').textContent = '';
        document.getElementById('emailSendBtn').disabled = false;
        document.getElementById('emailSendBtn').textContent = 'Send';
        document.getElementById('emailOverlay').style.display = 'flex';
        document.getElementById('emailToInput').focus();
    }
    function closeEmailModal(){
        document.getElementById('emailOverlay').style.display = 'none';
    }
    document.getElementById('emailCancelBtn').addEventListener('click', closeEmailModal);
    document.getElementById('emailOverlay').addEventListener('click', function(e){
        if (e.target === this) closeEmailModal();
    });

    // Blob -> base64 (without the data-URL prefix), so the Apps Script backend's
    // Utilities.base64Decode() can directly build the PDF bytes.
    function blobToBase64(blob){
        return new Promise(function(resolve, reject){
            var reader = new FileReader();
            reader.onloadend = function(){
                var result = reader.result; // "data:application/pdf;base64,...."
                resolve(result.substring(result.indexOf(',') + 1));
            };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    function isValidEmail(v){
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    // Same base Apps Script URL as the data feed above, without the listAll query
    // string -- the "action" for the email send is passed in the POST body instead.
    var EMAIL_API_URL = APPS_SCRIPT_URL.split('?')[0];
    var EMAIL_SEND_PASSWORD = "94976";

    async function sendEmailWithPdf(){
        var toEl = document.getElementById('emailToInput');
        var passEl = document.getElementById('emailPasswordInput');
        var msgEl = document.getElementById('emailModalMsg');
        var sendBtn = document.getElementById('emailSendBtn');
        var to = toEl.value.trim();

        if (!currentEmailRec){ msgEl.textContent = 'Please select a rake first.'; return; }
        if (passEl.value !== EMAIL_SEND_PASSWORD){ msgEl.textContent = 'Incorrect password.'; return; }
        if (!to || !isValidEmail(to)){ msgEl.textContent = 'Please enter a valid email address.'; return; }

        msgEl.textContent = '';
        sendBtn.disabled = true;
        sendBtn.textContent = 'Preparing PDF...';

        try {
            var result = await generateMemoPdfBlob(currentEmailRec);
            sendBtn.textContent = 'Sending...';
            var pdfBase64 = await blobToBase64(result.blob);

            var resp = await fetch(EMAIL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
                body: JSON.stringify({
                    action: 'sendEmail',
                    to: to,
                    subject: result.fileName.replace(/\.pdf$/i, ''),
                    fileName: result.fileName,
                    pdfBase64: pdfBase64
                })
            });
            var res = await resp.json();
            if (res.status !== 'success'){
                throw new Error(res.message || 'Unknown error from server.');
            }
            closeEmailModal();
            showSuccessPopup('&#128231; Email sent to <strong>' + to + '</strong> &#9989;');
        } catch (err){
            console.error('sendEmailWithPdf error:', err);
            msgEl.textContent = 'An error occurred while sending the email: ' + (err && err.message ? err.message : err);
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
        }
    }
    document.getElementById('emailSendBtn').addEventListener('click', sendEmailWithPdf);

    function showSuccessPopup(msgHtml){
        document.getElementById('successMsg').innerHTML = msgHtml;
        document.getElementById('successOverlay').style.display = 'flex';
    }
    function hideSuccessPopup(){
        document.getElementById('successOverlay').style.display = 'none';
    }
    document.getElementById('successOkBtn').addEventListener('click', hideSuccessPopup);
    document.getElementById('successOverlay').addEventListener('click', function(e){
        if (e.target === this) hideSuccessPopup();
    });

    document.getElementById('submitBtn').addEventListener('click', submitFilter);
    document.getElementById('clearStatementBtn').addEventListener('click', function(){
        statementWrap.style.display = "none";
    });

    init();
</script>
</body>
