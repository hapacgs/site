<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAGON TRANSFER REGISTER (WTR)</title>
<link rel="stylesheet" href="../iw_css/common.css">

<style>
.station-row select {
  width: 220px;
  text-align: center;
  padding: 8px;
  border: 1px solid var(--glass-border);
  background: rgba(10,22,48,0.95);
  color: var(--text);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
}

.station-row select:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 12px rgba(0,229,255,0.35);
}

.mini-info-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  margin: 4px 0 18px 0;
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  overflow: hidden;
  table-layout: fixed;
}

.mini-info-table td {
  text-align: center;
  padding: 8px 4px;
  font-size: 12px;
  border-bottom: 1px solid rgba(0,229,255,0.12);
  border-right: 1px solid rgba(0,229,255,0.08);
  word-wrap: break-word;
}

.mini-info-table td:last-child { border-right: none; }

.mini-info-table tr:first-child td {
  color: var(--cyan-soft);
  font-weight: 700;
  letter-spacing: 0.5px;
  background: rgba(0,229,255,0.06);
  border-bottom: 1px solid var(--glass-border);
}

.mini-info-table tr:last-child td { border-bottom: none; }

.date-time-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 35%;
  min-width: 0;
}

.date-time-wrap input[type="text"] {
  flex: 1 1 auto;
  min-width: 0;
  width: auto;
  padding: 7px 4px;
  font-size: 11px;
  text-align: right;
}

.pick-btn {
  flex: 0 0 auto;
  padding: 4px 6px;
  font-size: 11px;
  line-height: 1;
  background: linear-gradient(135deg, rgba(0,229,255,0.18), rgba(0,120,255,0.12));
  border: 1px solid rgba(0,229,255,0.35);
  color: var(--cyan-soft);
  border-radius: 8px;
  cursor: pointer;
}

.hidden-picker {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  pointer-events: none;
}

.status-arriving { color: #ff2b2b; }
.status-placed   { color: #c9a300; }
.status-released { color: #1f9d55; }

/* ---------------- Generic centered modal overlay (validation warnings) ---------------- */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-overlay.open { display: flex; }

.modal-box {
  background: #0a1830;
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 20px;
  max-width: 420px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
}
.modal-box h3 {
  margin: 0 0 14px 0;
  color: var(--cyan-soft);
  font-size: 15px;
  letter-spacing: 1px;
}
.modal-box p {
  margin: 0 0 10px 0;
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
}
.modal-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}

</style>
</head>

<body>
<div class="container">
    <h2>WAGON TRANSFER REGISTER (WTR)</h2>

    <div id="update-section">
        <div class="station-row">
            <label>SELECT RAKE ID HERE :</label>
            <select id="rakeIdSelect" style="width:220px;" tabindex="1">
                <option value=""></option>
            </select>
        </div>

        <table id="rakeInfoTable" class="mini-info-table" style="display:none;">
            <tr>
                <td>FROM</td><td>TO</td><td>WGNS.</td><td>COMMODITY</td>
            </tr>
            <tr>
                <td id="infoFrom"></td><td id="infoTo"></td><td id="infoWagons"></td><td id="infoCommodity"></td>
            </tr>
        </table>

        <div id="entryForm" style="display:none;">
            <div class="form-row">
                <label>PLACEMENT DATE <span class="small-note">(DD/MM/YYYY)</span></label>
                <div class="date-time-wrap">
                    <input type="text" id="placementDate" inputmode="numeric" placeholder="__/__/____" tabindex="2">
                    <button type="button" class="pick-btn" onclick="openNativePicker('placementDatePicker')">📅</button>
                    <input type="date" id="placementDatePicker" class="hidden-picker" tabindex="-1">
                </div>
            </div>
            <div class="form-row">
                <label>PLACEMENT TIME <span class="small-note">(24 HR)</span></label>
                <div class="date-time-wrap">
                    <input type="text" id="placementTime" inputmode="numeric" placeholder="HH:MM" tabindex="3">
                    <button type="button" class="pick-btn" onclick="openNativePicker('placementTimePicker','placementDate')">🕐</button>
                    <input type="time" id="placementTimePicker" class="hidden-picker" tabindex="-1">
                </div>
            </div>
            <div class="form-row">
                <label>RELEASE DATE <span class="small-note">(DD/MM/YYYY)</span></label>
                <div class="date-time-wrap">
                    <input type="text" id="releaseDate" inputmode="numeric" placeholder="__/__/____" tabindex="4">
                    <button type="button" class="pick-btn" onclick="openNativePicker('releaseDatePicker')">📅</button>
                    <input type="date" id="releaseDatePicker" class="hidden-picker" tabindex="-1">
                </div>
            </div>
            <div class="form-row">
                <label>RELEASE TIME <span class="small-note">(24 HR)</span></label>
                <div class="date-time-wrap">
                    <input type="text" id="releaseTime" inputmode="numeric" placeholder="HH:MM" tabindex="5">
                    <button type="button" class="pick-btn" onclick="openNativePicker('releaseTimePicker','releaseDate')">🕐</button>
                    <input type="time" id="releaseTimePicker" class="hidden-picker" tabindex="-1">
                </div>
            </div>
            <div class="form-row">
                <label>TOTAL DET. <span class="small-note">(AUTO CALCULATED)</span></label>
                <input type="text" id="totalDetDisplay" readonly style="opacity:0.75;" tabindex="-1">
            </div>
            <div class="form-row">
                <label>FREE HRS.</label>
                <input type="text" id="freeHrsDisplay" readonly style="opacity:0.75;" tabindex="-1">
            </div>
            <div class="form-row">
                <label>NIGHT INCENTIVE <span class="small-note">(AUTO CALCULATED)</span></label>
                <input type="text" id="nightIncDisplay" readonly style="opacity:0.75;" tabindex="-1">
            </div>
            <div class="form-row">
                <label>NET DET. <span class="small-note">(AUTO CALCULATED)</span></label>
                <input type="text" id="netDetDisplay" readonly style="opacity:0.75;" tabindex="-1">
            </div>
            <div class="form-row">
                <label>DEMM. HRS. <span class="small-note">(AUTO CALCULATED)</span></label>
                <input type="text" id="demmHrsDisplay" readonly style="opacity:0.75;" tabindex="-1">
            </div>
            <div class="form-row">
                <label>DEMM. AMT. <span class="small-note">(AUTO CALCULATED)</span></label>
                <input type="text" id="demmAmtDisplay" readonly style="opacity:0.75;" tabindex="-1">
            </div>
            <div class="form-row">
                <label>STATUS</label>
                <span id="statusValueCell" class="status-badge status-arriving">ARRIVING</span>
            </div>
            <div style="text-align:center; margin-top:6px;">
                <button class="submit-btn" id="updateSubmitBtn" onclick="submitUpdateEntry()" tabindex="6">SUBMIT</button>
            </div>
        </div>
    </div>
</div>

<!-- Validation warning popup for invalid / future date & time entries -->
<div class="modal-overlay" id="dateWarningOverlay">
    <div class="modal-box">
        <h3 id="dateWarningTitle">INVALID ENTRY</h3>
        <p id="dateWarningMessage"></p>
        <div class="modal-actions">
            <button type="button" class="submit-btn" id="dateWarningOkBtn" onclick="closeDateWarningModal()">OK</button>
        </div>
    </div>
</div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2hFOjiIlfK375_uBK3EQJ-_4KUwflq8AV3gmJtFjDGt-b-KhDm7avaq040OrxonTdTw/exec";
const SHEET_ID = "1kZF1pTmCnMcjMKwzLvxU6CMoyqkiBEGd2lWOYXSxo64";
const SHEET_NAME = "iw_rake_data";

let selectedRakeId = "";
let selectedWagonCount = 0;

// On page load, only Rake IDs whose STATUS is currently "ARRIVING" in the
// Google Sheet will appear in the dropdown (column A = rakeId, column B = JSON data)
function loadArrivingRakeIds() {
    let selectEl = document.getElementById("rakeIdSelect");
    let currentValue = selectEl.value;

    selectEl.innerHTML = "";
    let placeholderOpt = document.createElement("option");
    placeholderOpt.value = "";
    selectEl.appendChild(placeholderOpt);

    let url = APPS_SCRIPT_URL + "?action=listArriving&sheetId=" + SHEET_ID + "&sheetName=" + SHEET_NAME;

    fetch(url)
        .then(r => r.json())
        .then(res => {
            if (res.status === "success" && Array.isArray(res.rakeIds)) {
                res.rakeIds.forEach(id => {
                    let opt = document.createElement("option");
                    opt.value = id;
                    opt.textContent = id;
                    selectEl.appendChild(opt);
                });
                if (currentValue && res.rakeIds.indexOf(currentValue) !== -1) {
                    selectEl.value = currentValue;
                }
            }
        })
        .catch(err => console.error(err));
}

document.getElementById("rakeIdSelect").addEventListener("change", handleRakeIdSelected);

function handleRakeIdSelected() {
    let rakeId = document.getElementById("rakeIdSelect").value.trim();
    if (!rakeId) {
        document.getElementById("rakeInfoTable").style.display = "none";
        document.getElementById("entryForm").style.display = "none";
        clearDerivedFields();
        selectedRakeId = "";
        selectedWagonCount = 0;
        return;
    }

    let url = APPS_SCRIPT_URL + "?action=getRake&rakeId=" + encodeURIComponent(rakeId)
        + "&sheetId=" + SHEET_ID + "&sheetName=" + SHEET_NAME;

    fetch(url)
        .then(r => r.json())
        .then(res => {
            console.log("WTR getRake response:", res);
            if (res.status === "success" && res.found) {
                let data = res.data;
                selectedRakeId = rakeId;
                selectedWagonCount = parseInt(data.wagonCount) || 0;

                document.getElementById("infoFrom").innerText = data.stationFrom || "";
                document.getElementById("infoTo").innerText = data.stationTo || "";
                document.getElementById("infoWagons").innerText = data.wagonCount || "";
                document.getElementById("infoCommodity").innerText = data.commodityCode || "";
                document.getElementById("rakeInfoTable").style.display = "table";
                document.getElementById("entryForm").style.display = "block";

                document.getElementById("placementDate").value = data.placementDate || "";
                document.getElementById("placementTime").value = data.placementTime || "";
                document.getElementById("releaseDate").value = data.releaseDate || "";
                document.getElementById("releaseTime").value = data.releaseTime || "";

                // FREE HRS is loaded from the Google Sheet (already filled in at the time of Inward Tally submission)
                document.getElementById("freeHrsDisplay").value = data.freeHrs || "";

                refreshDerivedFields();
            } else {
                selectedRakeId = "";
                document.getElementById("rakeInfoTable").style.display = "none";
                document.getElementById("entryForm").style.display = "none";
                alert("This Rake ID was not found in the Google Sheet!");
            }
        })
        .catch(err => {
            console.error(err);
            alert("ERROR: Check console.");
        });
}

function clearDerivedFields() {
    ["placementDate","placementTime","releaseDate","releaseTime","totalDetDisplay",
     "freeHrsDisplay","nightIncDisplay","netDetDisplay","demmHrsDisplay","demmAmtDisplay"]
    .forEach(id => document.getElementById(id).value = "");
    setStatusBadge("ARRIVING");
}

// Opens the native calendar/clock as soon as the 📅 / 🕐 button is pressed; whatever
// date/time is picked is always written back into the text field in DD/MM/YYYY
// and 24 HR HH:MM format - the format never changes, on mobile or PC.
// dateId (optional, time pickers only): if the linked date is TODAY, the clock
// picker will not allow selecting a time later than the current time
function openNativePicker(pickerId, dateId) {
    let picker = document.getElementById(pickerId);
    if (picker.type === "date") {
        picker.max = todayISO(); // calendar me aaj se aage ki date disable
    } else if (picker.type === "time" && dateId) {
        let dVal = document.getElementById(dateId).value.trim();
        if (dVal === todayDMY()) picker.max = nowHM(); // aaj ki date hai to abhi tak ka hi time
        else picker.removeAttribute("max");
    }
    if (picker.showPicker) picker.showPicker();
    else picker.click();
}

document.getElementById("placementDatePicker").addEventListener("change", function () {
    if (!this.value) return;
    let parts = this.value.split("-"); // yyyy-mm-dd
    document.getElementById("placementDate").value = `${parts[2]}/${parts[1]}/${parts[0]}`;
    enforceDateNotFuture("placementDate");
    enforceTimeNotFuture("placementTime", "placementDate");
    refreshDerivedFields();
});

document.getElementById("releaseDatePicker").addEventListener("change", function () {
    if (!this.value) return;
    let parts = this.value.split("-");
    document.getElementById("releaseDate").value = `${parts[2]}/${parts[1]}/${parts[0]}`;
    enforceDateNotFuture("releaseDate");
    enforceTimeNotFuture("releaseTime", "releaseDate");
    refreshDerivedFields();
});

document.getElementById("placementTimePicker").addEventListener("change", function () {
    if (!this.value) return; // native time input value hamesha 24hr HH:MM hota hai
    document.getElementById("placementTime").value = this.value;
    enforceTimeNotFuture("placementTime", "placementDate");
    refreshDerivedFields();
});

document.getElementById("releaseTimePicker").addEventListener("change", function () {
    if (!this.value) return;
    document.getElementById("releaseTime").value = this.value;
    enforceTimeNotFuture("releaseTime", "releaseDate");
    refreshDerivedFields();
});

// STATUS badge: background is always white, font color changes based on state
// ARRIVING (default) = Red, ARRIVED (placement filled) = Yellow, RELEASED (release also filled) = Green
function setStatusBadge(status) {
    let badge = document.getElementById("statusValueCell");
    badge.innerText = status;
    badge.className = "status-badge " +
        (status === "RELEASED" ? "status-released" :
         status === "ARRIVED" ? "status-placed" : "status-arriving");
}

function updateStatusBadge() {
    let pDate = document.getElementById("placementDate").value.trim();
    let pTime = document.getElementById("placementTime").value.trim();
    let rDate = document.getElementById("releaseDate").value.trim();
    let rTime = document.getElementById("releaseTime").value.trim();

    if (rDate && rTime) {
        setStatusBadge("RELEASED");
    } else if (pDate && pTime) {
        setStatusBadge("ARRIVED");
    } else {
        setStatusBadge("ARRIVING");
    }
}

// DD/MM/YYYY -> YYYY-MM-DD, used internally only to build a JS Date object
function dmyToISO(dmy) {
    if (!dmy) return "";
    let p = dmy.split("/");
    if (p.length !== 3) return "";
    let dd = p[0].padStart(2, "0");
    let mm = p[1].padStart(2, "0");
    let yyyy = p[2];
    if (yyyy.length !== 4) return "";
    return `${yyyy}-${mm}-${dd}`;
}

// Today's date in DD/MM/YYYY format
function todayDMY() {
    let t = new Date();
    return `${String(t.getDate()).padStart(2, "0")}/${String(t.getMonth() + 1).padStart(2, "0")}/${t.getFullYear()}`;
}

// Today's date in YYYY-MM-DD format (for the native date picker's "max" attribute)
function todayISO() {
    let t = new Date();
    return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
}

// Current time in HH:MM (24 HR) format
function nowHM() {
    let t = new Date();
    return `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
}

// DD/MM/YY -> DD/MM/YYYY (auto-expands a 2-digit year, always assuming 20YY)
function normalizeDateYear(dmy) {
    let p = dmy.split("/");
    if (p.length !== 3 || p[2].length !== 2) return dmy;
    return `${p[0]}/${p[1]}/20${p[2]}`;
}

// Strict DD/MM/YYYY validator - the date must be exactly a 2-digit day, a
// 2-digit month and a full 4-digit year, and must resolve to a real calendar
// date. Anything shorter, longer, or malformed (e.g. "09/08/6") is invalid.
function isValidStrictDMY(dmy) {
    if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dmy)) return false;
    let p = dmy.split("/");
    let dd = parseInt(p[0], 10), mm = parseInt(p[1], 10), yyyy = parseInt(p[2], 10);
    let d = new Date(yyyy, mm - 1, dd);
    return d.getFullYear() === yyyy && d.getMonth() === mm - 1 && d.getDate() === dd;
}

// Styled replacement for the native alert() popup, used for every date/time
// validation warning (navy blue / cyan themed, matches the app's modal style).
function showDateWarningModal(title, message, focusEl) {
    document.getElementById("dateWarningTitle").innerText = title;
    document.getElementById("dateWarningMessage").innerText = message;
    window._dateWarningFocusEl = focusEl || null;
    document.getElementById("dateWarningOverlay").classList.add("open");
}
function closeDateWarningModal() {
    document.getElementById("dateWarningOverlay").classList.remove("open");
    if (window._dateWarningFocusEl) {
        let el = window._dateWarningFocusEl;
        window._dateWarningFocusEl = null;
        setTimeout(function () { el.focus(); }, 0);
    }
}

// Every date field must always hold a complete, valid DD/MM/YYYY date. A
// 2-digit year is auto-expanded to 20YY as a convenience; anything else that
// doesn't resolve to a full, real DD/MM/YYYY date (missing digits, a short
// year like "09/08/6", an impossible day/month, etc.) is rejected and the
// field is cleared for re-entry. Future dates are rejected the same way.
function enforceDateNotFuture(dateId) {
    let el = document.getElementById(dateId);
    if (!el || !el.value) return;
    let val = el.value;
    let parts = val.split("/");
    if (parts.length === 3 && parts[2].length === 2) {
        val = normalizeDateYear(val);
    }
    if (!isValidStrictDMY(val)) {
        showDateWarningModal("INVALID DATE", "Please enter a complete, valid date in DD/MM/YYYY format (e.g. " + todayDMY() + ").", el);
        el.value = "";
        return;
    }
    el.value = val;
    let iso = dmyToISO(val);
    let entered = new Date(iso + "T00:00:00");
    let today = new Date(dmyToISO(todayDMY()) + "T00:00:00");
    if (entered.getTime() > today.getTime()) {
        showDateWarningModal("FUTURE DATE NOT ALLOWED", "Future dates are not allowed. Please enter today's date (" + todayDMY() + ") or an earlier date.", el);
        el.value = "";
    }
}

// Future time is not allowed in time fields - BUT only when its linked date
// is TODAY's date. If the date is earlier than today, any time is allowed.
function enforceTimeNotFuture(timeId, dateId) {
    let el = document.getElementById(timeId);
    if (!el || !el.value || !dateId) return;
    let dateEl = document.getElementById(dateId);
    let dVal = dateEl ? dateEl.value.trim() : "";
    if (dVal === todayDMY()) {
        let cur = nowHM();
        if (el.value > cur) {
            showDateWarningModal("FUTURE TIME NOT ALLOWED", "Future time is not allowed. Please enter a time up to the current time (" + cur + ").", el);
            el.value = "";
        }
    }
}

// Auto-formats the text input into DD/MM/YYYY as the user types
// linkedTimeId (optional): on leaving the field, also re-validates its paired
// time field (in case the date change made it a future time)
function attachDateMask(id, linkedTimeId) {
    let el = document.getElementById(id);
    el.setAttribute("maxlength", "10");
    el.addEventListener("input", function () {
        let digits = this.value.replace(/\D/g, "").substring(0, 8);
        let out = digits;
        if (digits.length > 4) out = digits.substring(0, 2) + "/" + digits.substring(2, 4) + "/" + digits.substring(4);
        else if (digits.length > 2) out = digits.substring(0, 2) + "/" + digits.substring(2);
        this.value = out;
    });
    el.addEventListener("blur", function () {
        enforceDateNotFuture(id);
        if (linkedTimeId) enforceTimeNotFuture(linkedTimeId, id);
        this.dispatchEvent(new Event("change"));
    });
}

// Auto-formats the text input into 24 HR HH:MM as the user types
// linkedDateId: if its date field is TODAY's date, a time later than the
// current time is not allowed
function attachTimeMask(id, linkedDateId) {
    let el = document.getElementById(id);
    el.setAttribute("maxlength", "5");
    el.addEventListener("input", function () {
        let digits = this.value.replace(/\D/g, "").substring(0, 4);
        let hh = digits.substring(0, 2);
        if (hh.length === 2 && parseInt(hh, 10) > 23) hh = "23";
        let out = hh;
        if (digits.length > 2) out = hh + ":" + digits.substring(2);
        this.value = out;
    });
    el.addEventListener("blur", function () {
        let parts = this.value.split(":");
        if (parts.length === 2 && parts[1] !== "") {
            let mm = parseInt(parts[1], 10);
            if (!isNaN(mm) && mm > 59) parts[1] = "59";
            if (parts[1].length === 1) parts[1] = "0" + parts[1];
            this.value = parts[0] + ":" + parts[1];
        }
        enforceTimeNotFuture(id, linkedDateId);
        this.dispatchEvent(new Event("change"));
    });
}

attachDateMask("placementDate", "placementTime");
attachDateMask("releaseDate", "releaseTime");
attachTimeMask("placementTime", "placementDate");
attachTimeMask("releaseTime", "releaseDate");

["placementDate", "placementTime", "releaseDate", "releaseTime"].forEach(id => {
    document.getElementById(id).addEventListener("input", refreshDerivedFields);
    document.getElementById(id).addEventListener("change", refreshDerivedFields);
});

// TOTAL DET. logic: (Release Date+Time) - (Placement Date+Time), formatted as HH:MM
function computeTotalDet(pDate, pTime, rDate, rTime) {
    if (!pDate || !pTime || !rDate || !rTime) return "";
    let placement = new Date(`${dmyToISO(pDate)}T${pTime}:00`);
    let release = new Date(`${dmyToISO(rDate)}T${rTime}:00`);
    if (isNaN(placement.getTime()) || isNaN(release.getTime())) return "";
    let diffMs = release - placement;
    if (diffMs < 0) return "";
    let totalMinutes = Math.round(diffMs / 60000);
    let hours = Math.floor(totalMinutes / 60);
    let minutes = totalMinutes % 60;
    return `${hours}:${minutes.toString().padStart(2, "0")}`;
}

// NIGHT INCENTIVE logic: within the window from Placement -> Placement+FreeHrs,
// whichever hours fall in the 22:00-06:00 (night) band get a 50% incentive
function computeNightIncentive(pDate, pTime, freeHrs) {
    if (!pDate || !pTime) return "";
    let hrs = parseFloat(freeHrs);
    if (isNaN(hrs) || hrs <= 0) return "";

    let placement = new Date(`${dmyToISO(pDate)}T${pTime}:00`);
    if (isNaN(placement.getTime())) return "";

    let windowEnd = new Date(placement.getTime() + hrs * 3600000);

    let totalNightMinutes = 0;
    let cursor = new Date(placement);
    cursor.setHours(0, 0, 0, 0);
    cursor.setDate(cursor.getDate() - 1);

    while (cursor <= windowEnd) {
        let nightStart = new Date(cursor);
        nightStart.setHours(22, 0, 0, 0);
        let nightEnd = new Date(nightStart.getTime() + 8 * 3600000);

        let overlapStart = new Date(Math.max(placement.getTime(), nightStart.getTime()));
        let overlapEnd = new Date(Math.min(windowEnd.getTime(), nightEnd.getTime()));

        if (overlapEnd > overlapStart) {
            totalNightMinutes += (overlapEnd - overlapStart) / 60000;
        }
        cursor.setDate(cursor.getDate() + 1);
    }

    let incentiveMinutes = Math.round(totalNightMinutes * 0.5);
    let ihrs = Math.floor(incentiveMinutes / 60);
    let imin = incentiveMinutes % 60;
    return `${ihrs.toString().padStart(2, "0")}:${imin.toString().padStart(2, "0")}`;
}

// HH:MM string -> total minutes
function parseHHMMToMinutes(str) {
    if (!str) return 0;
    let parts = str.toString().split(":");
    if (parts.length !== 2) return 0;
    let h = parseInt(parts[0], 10) || 0;
    let m = parseInt(parts[1], 10) || 0;
    return h * 60 + m;
}

// total minutes -> HH:MM string (clamped at 0)
function minutesToHHMM(totalMinutes) {
    if (totalMinutes < 0) totalMinutes = 0;
    let h = Math.floor(totalMinutes / 60);
    let m = totalMinutes % 60;
    return `${h}:${m.toString().padStart(2, "0")}`;
}

// NET DET. logic: TOTAL DET. - FREE HRS. - NIGHT INCENTIVE
function computeNetDet(totalDetStr, freeHrs, nightIncStr) {
    let totalMin = parseHHMMToMinutes(totalDetStr);
    let freeMin = (parseFloat(freeHrs) || 0) * 60;
    let nightMin = parseHHMMToMinutes(nightIncStr);
    return minutesToHHMM(totalMin - freeMin - nightMin);
}

// DEMM. HRS. logic: round NET DET. up to the next full hour
function computeDemmHrs(netDetStr) {
    let parts = (netDetStr || "0:00").split(":");
    let h = parseInt(parts[0], 10) || 0;
    let m = parseInt(parts[1], 10) || 0;
    return m > 0 ? h + 1 : h;
}

// DEMM. AMT. logic: slab-wise rate per wagon x No. of wagons
const DEMM_SLABS = [
    { hrs: 6,        rate: 150 },
    { hrs: 6,        rate: 165 },
    { hrs: 12,       rate: 187.5 },
    { hrs: 24,       rate: 225 },
    { hrs: 24,       rate: 300 },
    { hrs: Infinity, rate: 450 }
];

function computeDemmAmount(wagonCount, demmHrs) {
    let remaining = demmHrs;
    let perWagon = 0;
    for (let i = 0; i < DEMM_SLABS.length && remaining > 0; i++) {
        let chargeable = Math.min(remaining, DEMM_SLABS[i].hrs);
        perWagon += chargeable * DEMM_SLABS[i].rate;
        remaining -= chargeable;
    }
    return Math.round(perWagon * (parseInt(wagonCount) || 0) * 100) / 100;
}

// Master refresh: TOTAL DET. -> NIGHT INCENTIVE -> NET DET. -> DEMM. HRS. -> DEMM. AMT.
function refreshDerivedFields() {
    let pDate = document.getElementById("placementDate").value;
    let pTime = document.getElementById("placementTime").value;
    let rDate = document.getElementById("releaseDate").value;
    let rTime = document.getElementById("releaseTime").value;
    let freeHrs = document.getElementById("freeHrsDisplay").value;

    let totalDet = computeTotalDet(pDate, pTime, rDate, rTime);
    let nightInc = computeNightIncentive(pDate, pTime, freeHrs);
    let netDet = computeNetDet(totalDet, freeHrs, nightInc);
    let demmHrs = computeDemmHrs(netDet);
    let demmAmt = computeDemmAmount(selectedWagonCount, demmHrs);

    document.getElementById("totalDetDisplay").value = totalDet;
    document.getElementById("nightIncDisplay").value = nightInc;
    document.getElementById("netDetDisplay").value = netDet;
    document.getElementById("demmHrsDisplay").value = demmHrs;
    document.getElementById("demmAmtDisplay").value = demmAmt.toFixed(2);

    updateStatusBadge();
}

function submitUpdateEntry() {
    if (!selectedRakeId) { alert("Please select a valid Rake ID first!"); return; }

    let status = document.getElementById("statusValueCell").innerText;

    let payload = {
        action: "updateWtr",
        sheetId: SHEET_ID,
        sheetName: SHEET_NAME,
        rakeId: selectedRakeId,
        placementDate: document.getElementById("placementDate").value.trim(),
        placementTime: document.getElementById("placementTime").value.trim(),
        releaseDate: document.getElementById("releaseDate").value.trim(),
        releaseTime: document.getElementById("releaseTime").value.trim(),
        totalDet: document.getElementById("totalDetDisplay").value,
        nightIncentive: document.getElementById("nightIncDisplay").value,
        netDet: document.getElementById("netDetDisplay").value,
        demmHrs: document.getElementById("demmHrsDisplay").value,
        demmAmt: document.getElementById("demmAmtDisplay").value,
        status: status
    };

    let btn = document.getElementById("updateSubmitBtn");
    btn.disabled = true;
    btn.innerText = "SENDING...";

    fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(res => {
        if (res.status === "success") {
            alert("DATA SENT SUCCESSFULLY !!!");
            location.reload();
        } else {
            alert("ERROR: " + (res.message || "Error..."));
        }
    })
    .catch(err => {
        console.error(err);
        alert("ERROR: Check console.");
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerText = "SUBMIT";
    });
}

loadArrivingRakeIds();
