<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> PRINT WAGON SUMMARY - HAPA Goods Shed</title>
<link rel="stylesheet" href="../iw_css/common.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    :root {
        --wsm-navy-deep: #050b18;
        --wsm-navy: #0a1630;
        --wsm-navy-mid: #0f2148;
        --wsm-cyan: #00e5ff;
        --wsm-cyan-soft: #7ff5ff;
        --wsm-glass-border: rgba(0,229,255,0.25);
        --wsm-text: #eaf6ff;
    }

    /* Overall page width on screen: content sits in the middle 70%, with a
       blank 15% margin on the left and right. Table stays matched to the
       filter card's width (rule below), so both shrink together. Reset back
       to full width when actually printing the A4 wagon list so the printed
       sheet isn't squeezed. */
    body > .page-title,
    body > #filterCard,
    body > #statusMsg,
    body > #resultsCard,
    body > #statementWrap {
        width: 70%;
        max-width: 70%;
        margin-left: auto;
        margin-right: auto;
        box-sizing: border-box;
    }
    @media print {
        body > .page-title,
        body > #filterCard,
        body > #statusMsg,
        body > #resultsCard,
        body > #statementWrap {
            width: 100% !important;
            max-width: 100% !important;
            margin-left: 0 !important;
            margin-right: 0 !important;
        }
    }

    /* Date-picker (calendar) icon on the two RR DATE inputs, tinted cyan to
       match the theme's --wsm-cyan. Chrome/Edge only (::-webkit-...); the
       lang="en-GB" attribute added on those inputs makes the browser show
       and accept dates as DD/MM/YYYY instead of the locale default. */
    input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(70%) sepia(85%) saturate(4000%) hue-rotate(163deg) brightness(103%) contrast(101%);
        cursor: pointer;
    }

    /* The results table's outer box should always be exactly as wide as the
       filter card above it, never wider -- if the table's content needs more
       room than that (13 columns), it scrolls horizontally *inside* the box
       instead of stretching the box itself past the filter card's edge. */
    #filterCard, #resultsCard {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
    }
    #resultsCard { overflow: hidden; }
    #resultsCard .table-wrap {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        box-sizing: border-box;
    }
    #resultsCard .results-table { width: 100%; }

    /* Icon-only action buttons (PDF / EXCEL / PRINT / EMAIL) in the results table --
       forced to the same size here (with !important) so the PDF icon can't end up
       smaller than the other three because of any older sizing left over elsewhere. */
    .row-action-btn svg {
        width: 32px !important;
        height: 32px !important;
        display: block;
    }
    .row-action-btn {
        background: none;
        border: none;
        padding: 4px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
    }
    .row-action-btn:hover { background: rgba(0,0,0,0.06); }
    .row-action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Themed popup overlay, reused for the Email modal and the Success modal --
       same dark navy / glowing cyan look as the rest of this app. */
    .wsm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(2,6,16,0.72);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
    }
    .wsm-box {
        background: linear-gradient(160deg, var(--wsm-navy-deep), var(--wsm-navy) 60%, var(--wsm-navy-mid));
        border: 1px solid var(--wsm-glass-border);
        border-radius: 16px;
        padding: 24px 22px;
        max-width: 320px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 50px rgba(0,0,0,0.6), 0 0 40px rgba(0,229,255,0.15);
    }
    .wsm-icon { font-size: 32px; color: var(--wsm-cyan); text-shadow: 0 0 16px rgba(0,229,255,0.6); margin-bottom: 8px; }
    .wsm-title {
        color: var(--wsm-cyan-soft);
        font-weight: 800;
        letter-spacing: 1.8px;
        font-size: 14px;
        margin-bottom: 14px;
        text-transform: uppercase;
        text-shadow: 0 0 18px rgba(0,229,255,0.5);
    }
    .wsm-label { font-size: 12.5px; text-align: left; margin-bottom: 6px; color: var(--wsm-text); }
    .wsm-input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--wsm-glass-border);
        background: rgba(0,20,32,0.6);
        color: var(--wsm-text);
        font-size: 13px;
        outline: none;
        margin-bottom: 12px;
    }
    .wsm-input::placeholder { color: #6f89a3; }
    .wsm-input:focus { border-color: var(--wsm-cyan); box-shadow: 0 0 10px rgba(0,229,255,0.35); }
    .wsm-error { min-height: 16px; font-size: 12px; color: #ff8f8f; margin: 0 0 6px; text-align: left; }
    .wsm-msg { font-size: 14px; margin-bottom: 18px; color: var(--wsm-text); line-height: 1.5; }
    .wsm-btns { display: flex; gap: 12px; justify-content: center; margin-top: 6px; }
    .wsm-btn {
        padding: 10px 28px;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        letter-spacing: 0.5px;
    }
    .wsm-btn-primary { background: linear-gradient(135deg, var(--wsm-cyan), #0090c8); color: #001824; box-shadow: 0 0 16px rgba(0,229,255,0.4); }
    .wsm-btn-primary:hover { box-shadow: 0 0 24px rgba(0,229,255,0.55); }
    .wsm-btn-cancel { background: linear-gradient(135deg, #5a6b7a, #33414d); color: var(--wsm-text); box-shadow: none; }
    .wsm-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
</style>
</head>
<body>

<div class="page-title">PRINT WAGON SUMMARY</div>

<!-- ===== Search / Filter ===== -->
<div class="card" id="filterCard">
    <div class="filter-grid">
        <div class="field">
            <label for="stationFrom">STATION FROM</label>
            <input list="stationList" id="stationFrom" placeholder="Type or select station">
            <datalist id="stationList"></datalist>
        </div>
        <div class="field">
            <label for="consigneeCode">CONSIGNEE</label>
            <input list="consigneeList" id="consigneeCode" placeholder="Type or select consignee">
            <datalist id="consigneeList"></datalist>
        </div>
        <div class="field">
            <label for="fromDate">RR DATE (FROM)</label>
            <input type="date" id="fromDate" lang="en-GB">
        </div>
        <div class="field">
            <label for="toDate">RR DATE (TO)</label>
            <input type="date" id="toDate" lang="en-GB">
        </div>
        <div class="field">
            <label>&nbsp;</label>
            <button id="submitBtn" disabled>SUBMIT</button>
        </div>
    </div>
</div>

<div class="status-msg" id="statusMsg">Data is Loading... Please Wait</div>

<!-- ===== Results ===== -->
<div class="card" id="resultsCard" style="display:none;">
    <div class="table-wrap">
        <table class="results-table">
            <thead>
                <tr>
                    <th class="col-sr">SR. NO.</th>
                    <th>FROM</th>
                    <th>TO</th>
                    <th class="col-wgn">WGN.</th>
                    <th>RR NUMBER</th>
                    <th>RR DATE</th>
                    <th>INV.</th>
                    <th>CONSIGNER</th>
                    <th>CONSIGNEE</th>
                    <th class="col-pdf">PDF</th>
                    <th class="col-pdf">EXCEL</th>
                    <th class="col-pdf">PRINT</th>
                    <th class="col-pdf">E-MAIL</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>
</div>

<!-- ===== A4 Landscape Wagon List (3 copies: Tally / Delivery Book / No Taker) ===== -->
<div id="statementWrap">
    <div class="a4-actions">
        <button id="clearBtn">CLEAR</button>
    </div>
    <div class="a4-page">
        <div class="sections-row" id="sectionsRow"></div>
    </div>
</div>

<!-- Email popup: takes the recipient's email, generates the PDF, and sends it
     via the Apps Script backend (same flow as the Placement Memo page) -->
<div class="wsm-overlay" id="emailOverlay">
    <div class="wsm-box">
        <div class="wsm-icon">&#9993;</div>
        <div class="wsm-title">Send Email</div>
        <div class="wsm-label">To (email address) :</div>
        <input type="email" id="emailToInput" class="wsm-input" placeholder="example@gmail.com" autocomplete="off">
        <div class="wsm-label">Password :</div>
        <input type="password" id="emailPasswordInput" class="wsm-input" placeholder="Enter password" autocomplete="off">
        <div id="emailModalMsg" class="wsm-error"></div>
        <div class="wsm-btns">
            <button class="wsm-btn wsm-btn-cancel" id="emailCancelBtn" type="button">Cancel</button>
            <button class="wsm-btn wsm-btn-primary" id="emailSendBtn" type="button">Send</button>
        </div>
    </div>
</div>

<!-- Success popup, shown once the email has been sent -->
<div class="wsm-overlay" id="successOverlay">
    <div class="wsm-box">
        <div class="wsm-icon">&#127881;</div>
        <div class="wsm-title">Success</div>
        <div class="wsm-msg" id="successMsg"></div>
        <button class="wsm-btn wsm-btn-primary" id="successOkBtn" type="button">OK</button>
    </div>
</div>

<script>
    // Live rake feed (Google Apps Script) — single call via the listAll action, response is { records: [...] }.
    var SHEET_ID = "1kZF1pTmCnMcjMKwzLvxU6CMoyqkiBEGd2lWOYXSxo64";
    var SHEET_NAME = "iw_rake_data";
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2hFOjiIlfK375_uBK3EQJ-_4KUwflq8AV3gmJtFjDGt-b-KhDm7avaq040OrxonTdTw/exec"
        + "?action=listAll&sheetId=" + encodeURIComponent(SHEET_ID) + "&sheetName=" + encodeURIComponent(SHEET_NAME);

    var statusMsg = document.getElementById('statusMsg');
    var resultsCard = document.getElementById('resultsCard');
    var resultsBody = document.getElementById('resultsBody');
    var stationList = document.getElementById('stationList');
    var consigneeList = document.getElementById('consigneeList');
    var statementWrap = document.getElementById('statementWrap');

    var allRecords = []; // { id, data }
    var filteredRecords = [];

    function setStatus(msg, isError){
        statusMsg.textContent = msg || "";
        statusMsg.className = "status-msg" + (isError ? " error" : "");
    }

    function pad2(n){ return n < 10 ? "0" + n : "" + n; }

    // Backend dates come through already-formatted as text, e.g. "25/07/2026" (RR DATE)
    // or "22-07-2026" (INVOICE DATE) -- both DD-then-MM-then-YYYY, separator varies.
    // Every date rendered on screen or in the printed sheet goes through this pair,
    // so display is always DD/MM/YYYY regardless of how the backend sent it.
    function parseSheetDate(raw){
        if (!raw) return null;
        var parts = String(raw).trim().split(/[\/\-\.]/);
        if (parts.length !== 3) return null;
        var d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
        if (!d || !m || !y) return null;
        return new Date(y, m - 1, d);
    }
    function formatSheetDate(raw){
        var d = parseSheetDate(raw);
        return d ? (pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear()) : "-";
    }
    // Same as formatSheetDate but dash-separated (DD-MM-YYYY) -- used only for
    // filenames, since "/" is not a valid character in a filename.
    function formatSheetDateForFileName(raw){
        var d = parseSheetDate(raw);
        return d ? (pad2(d.getDate()) + "-" + pad2(d.getMonth() + 1) + "-" + d.getFullYear()) : "-";
    }

    // The From/To filter fields are native <input type="date"> pickers, which always
    // hand back their value as ISO "YYYY-MM-DD" -- parsed separately from the DD/MM/YYYY
    // text the backend sends, since the two never share a separator order.
    function parseDatePickerValue(val){
        if (!val) return null;
        var parts = val.split("-");
        if (parts.length !== 3) return null;
        var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
        if (!y || !m || !d) return null;
        return new Date(y, m - 1, d);
    }

    // Accepts a bare array, a {records:[...]}/{data:[...]}/{rows:[...]}/{result:[...]} wrapper,
    // or a single rake object -- normalizes to an array either way.
    function extractArray(json){
        if (Array.isArray(json)) return json;
        if (json && Array.isArray(json.records)) return json.records;
        if (json && Array.isArray(json.data)) return json.data;
        if (json && Array.isArray(json.rows)) return json.rows;
        if (json && Array.isArray(json.result)) return json.result;
        if (json && typeof json === "object" && Object.prototype.hasOwnProperty.call(json, "rakeId")) return [json];
        return [];
    }

    // Only rakes whose STATUS column is "ARRIVING" (any case) are loaded/shown --
    // every other status is dropped right here, before the list even reaches the page.
    function fetchAllRecords(){
        return fetch(APPS_SCRIPT_URL).then(function(r){ return r.json(); }).then(function(json){
            if (json && json.status === "error") throw new Error(json.message || "Backend error");
            var arr = extractArray(json);
            arr = arr.filter(function(d){
                return d && d.status && String(d.status).trim().toUpperCase() === "ARRIVING";
            });
            return arr.map(function(d, i){ return { id: (d.rakeId || d.rrNumber || ("rake_" + i)), data: d }; });
        });
    }

    function populateStationList(){
        var seen = {};
        stationList.innerHTML = "";
        allRecords.forEach(function(rec){
            var s = rec.data.stationFrom;
            if (s && !seen[s]){ seen[s] = true; var opt = document.createElement('option'); opt.value = s; stationList.appendChild(opt); }
        });
    }
    function populateConsigneeList(){
        var seen = {};
        consigneeList.innerHTML = "";
        allRecords.forEach(function(rec){
            var c = rec.data.consignee;
            if (c && !seen[c]){ seen[c] = true; var opt = document.createElement('option'); opt.value = c; consigneeList.appendChild(opt); }
        });
    }

    function init(){
        setStatus("Data is Loading... Please Wait");
        var submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        fetchAllRecords().then(function(records){
            allRecords = records;
            populateStationList();
            populateConsigneeList();
            if (records.length === 0){
                setStatus("No rakes found.", true);
            } else {
                setStatus("Data loaded -- showing all rakes.");
                submitFilter();
            }
            submitBtn.disabled = false;
        }).catch(function(err){
            setStatus("Error loading data: " + err.message, true);
            submitBtn.disabled = false;
        });
    }

    var pdfIconSvg = '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#e53935"/>' +
        '<path d="M14 2v4a1 1 0 0 0 1 1h4" fill="#ff8a80"/>' +
        '<text x="12" y="16.5" text-anchor="middle" font-size="6.5" font-family="Arial, sans-serif" font-weight="700" fill="#fff">PDF</text>' +
        '</svg>';
    var xlsIconSvg = '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M6 2h8l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#1e7d32"/>' +
        '<path d="M14 2v4a1 1 0 0 0 1 1h4" fill="#81c784"/>' +
        '<text x="12" y="16.5" text-anchor="middle" font-size="6.5" font-family="Arial, sans-serif" font-weight="700" fill="#fff">XLS</text>' +
        '</svg>';
    var printIconSvg = '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M6 9V3h12v6" stroke="#455a64" stroke-width="1.6" stroke-linejoin="round" fill="none"/>' +
        '<rect x="4" y="9" width="16" height="7" rx="1" fill="#607d8b"/>' +
        '<rect x="6" y="15" width="12" height="6" fill="#eceff1" stroke="#455a64" stroke-width="1"/>' +
        '<circle cx="17" cy="12" r="0.8" fill="#eceff1"/>' +
        '</svg>';
    var emailIconSvg = '<svg viewBox="0 0 24 24" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="2" y="4" width="20" height="16" rx="2" fill="#1565c0"/>' +
        '<path d="M3 6l9 7 9-7" stroke="#bbdefb" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg>';

    function renderResults(records){
        resultsBody.innerHTML = "";
        if (records.length === 0){
            resultsCard.style.display = "block";
            resultsBody.innerHTML = '<tr><td colspan="13">No matching rakes found.</td></tr>';
            return;
        }
        records.forEach(function(rec, idx){
            var d = rec.data;
            var tr = document.createElement('tr');
            tr.innerHTML =
                '<td class="col-sr">' + (idx + 1) + '</td>' +
                '<td>' + (d.stationFrom || "-") + '</td>' +
                '<td>' + (d.stationTo || "-") + '</td>' +
                '<td class="col-wgn">' + (d.wagonCount || "-") + '</td>' +
                '<td>' + (d.rrNumber || "-") + '</td>' +
                '<td>' + formatSheetDate(d.rrDate) + '</td>' +
                '<td>' + (d.invoiceNo || "-") + '</td>' +
                '<td>' + (d.consigner || "-") + '</td>' +
                '<td>' + (d.consignee || "-") + '</td>' +
                '<td class="col-pdf"><button type="button" class="row-action-btn gen-row-btn" data-idx="' + idx + '" title="Generate &amp; Save PDF">' + pdfIconSvg + '</button></td>' +
                '<td class="col-pdf"><button type="button" class="row-action-btn xls-row-btn" data-idx="' + idx + '" title="Generate &amp; Save Excel">' + xlsIconSvg + '</button></td>' +
                '<td class="col-pdf"><button type="button" class="row-action-btn print-row-btn" data-idx="' + idx + '" title="Print">' + printIconSvg + '</button></td>' +
                '<td class="col-pdf"><button type="button" class="row-action-btn email-row-btn" data-idx="' + idx + '" title="Email">' + emailIconSvg + '</button></td>';
            resultsBody.appendChild(tr);
        });
        resultsCard.style.display = "block";

        document.querySelectorAll('.gen-row-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
                var idx = parseInt(btn.getAttribute('data-idx'), 10);
                downloadStatementPdf(filteredRecords[idx], idx);
            });
        });
        document.querySelectorAll('.xls-row-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
                var idx = parseInt(btn.getAttribute('data-idx'), 10);
                exportStatementExcel(filteredRecords[idx]);
            });
        });
        document.querySelectorAll('.print-row-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
                var idx = parseInt(btn.getAttribute('data-idx'), 10);
                printStatement(filteredRecords[idx], idx);
            });
        });
        document.querySelectorAll('.email-row-btn').forEach(function(btn){
            btn.addEventListener('click', function(){
                var idx = parseInt(btn.getAttribute('data-idx'), 10);
                openEmailModal(filteredRecords[idx], idx);
            });
        });
    }

    function submitFilter(){
        var station = document.getElementById('stationFrom').value.trim().toLowerCase();
        var consignee = document.getElementById('consigneeCode').value.trim().toLowerCase();
        var fromD = parseDatePickerValue(document.getElementById('fromDate').value);
        var toD = parseDatePickerValue(document.getElementById('toDate').value);
        var noFiltersApplied = !station && !consignee && !fromD && !toD;

        filteredRecords = allRecords.filter(function(rec){
            var d = rec.data;
            if (station && (!d.stationFrom || String(d.stationFrom).toLowerCase().indexOf(station) === -1)) return false;
            if (consignee && (!d.consignee || String(d.consignee).toLowerCase().indexOf(consignee) === -1)) return false;
            // Only apply the RR DATE range when a date exists on the record so rows
            // without an RR DATE aren't hidden unless the user has actually filtered.
            if ((fromD || toD) && d.rrDate){
                var rDate = parseSheetDate(d.rrDate);
                if (rDate){
                    if (fromD && rDate < fromD) return false;
                    if (toD && rDate > toD) return false;
                }
            }
            return true;
        });

        // Latest RR DATE first, oldest last.
        filteredRecords.sort(function(a, b){
            var da = parseSheetDate(a.data.rrDate);
            var db = parseSheetDate(b.data.rrDate);
            if (!da && !db) return 0;
            if (!da) return 1;
            if (!db) return -1;
            return db - da;
        });

        // With no station/consignee/date filter applied (plain page load), only the
        // latest 10 rakes are shown so the table doesn't dump the entire sheet at once.
        // Once the user searches by station, consignee, or an RR Date range, the full
        // matching set is shown -- that's how older records become reachable.
        var recordsToShow = noFiltersApplied ? filteredRecords.slice(0, 10) : filteredRecords;

        var count = recordsToShow.length;
        if (noFiltersApplied && filteredRecords.length > recordsToShow.length){
            setStatus("Showing latest 10 of " + filteredRecords.length + " rakes -- use RR Date filter to see older records.");
        } else {
            setStatus("Record Found : " + (count < 10 ? "0" + count : count) + " Rake" + (count === 1 ? "" : "s"));
        }
        renderResults(recordsToShow);
        statementWrap.style.display = "none";
    }

    // Long wagon numbers (e.g. 11-digit) are trimmed to the last 6 digits, right side,
    // so they fit the printed column without wrapping or overflowing.
    function shortNo(no){
        if (!no || no === "-") return "-";
        var s = String(no);
        return s.length > 6 ? s.slice(-6) : s;
    }

    function buildSectionHTML(caption, wagonRows, summary){
        // Only as many rows as there are wagons (split across the two halves) --
        // no fixed 30-row block, so a short rake leaves the rest of the sheet for the summary.
        var rowCount = Math.max(1, Math.ceil(wagonRows.length / 2));

        var html = '<table class="wagon-table">';
        html += '<colgroup>' +
            '<col style="width:6%"><col style="width:10%"><col style="width:15%"><col style="width:19%">' +
            '<col style="width:6%"><col style="width:10%"><col style="width:15%"><col style="width:19%">' +
            '</colgroup>';
        html += '<thead><tr>' +
            '<th>SR.</th><th>RLY</th><th>TYPE</th><th>NO.</th>' +
            '<th>SR.</th><th>RLY</th><th>TYPE</th><th>NO.</th>' +
            '</tr></thead>';
        html += '<tbody>';
        for (var i = 0; i < rowCount; i++){
            var left = wagonRows[i];
            var right = wagonRows[i + rowCount];
            html += '<tr>' +
                '<td>' + (left ? (i + 1) : '') + '</td>' +
                '<td class="' + (left ? '' : 'blank') + '">' + (left ? left.rly : '-') + '</td>' +
                '<td class="' + (left ? '' : 'blank') + '">' + (left ? left.type : '-') + '</td>' +
                '<td class="' + (left ? '' : 'blank') + '">' + (left ? shortNo(left.no) : '-') + '</td>' +
                '<td>' + (right ? (i + rowCount + 1) : '') + '</td>' +
                '<td class="' + (right ? '' : 'blank') + '">' + (right ? right.rly : '-') + '</td>' +
                '<td class="' + (right ? '' : 'blank') + '">' + (right ? right.type : '-') + '</td>' +
                '<td class="' + (right ? '' : 'blank') + '">' + (right ? shortNo(right.no) : '-') + '</td>' +
                '</tr>';
        }
        html += '</tbody></table>';

        // Summary -- first line is plain readable text (no box), rest are modern
        // boxed label/value cards, plus a manual RISK TYPE stamp selector at the end.
        html += '<div class="summary-block">';
        html += '<div class="summary-title">SUMMARY</div>';
        html += '<div class="summary-item station-box"><span class="lbl">STATION :</span><span class="val">' +
            summary.from + ' TO ' + summary.to + '</span></div>';
        html += '<div class="summary-item"><span class="lbl">NO. OF WAGONS :</span><span class="val">' + summary.wgn + '</span></div>';
        html += sRow(['INV. NO.', summary.ivNo], ['INVOICE DATE', summary.ivDate]);
        html += sRow(['RR NUMBER', summary.rNo], ['RR DATE', summary.rDt]);
        html += sRow(['CWT', summary.cwt], ['AWT', summary.awt]);
        html += sRow(['CONSIGNER', summary.cnsr], ['CONSIGNEE', summary.cnsg]);
        html += sRow(['COMMODITY', summary.omm], ['CLASS', summary.cls]);
        html += '<div class="summary-full freight-row">' +
            '<span><span class="lbl">FREIGHT :</span> <span class="val">' + money(summary.freight) + '</span></span>' +
            '<span><span class="lbl">GST :</span> <span class="val">' + money(summary.gst) + '</span></span>' +
            '<span><span class="lbl">TOTAL FREIGHT :</span> <span class="val val-highlight">' + money(summary.totalFreight) + '</span></span>' +
            '</div>';
        html += '<div class="summary-item"><span class="lbl">DELIVERY NO. :</span><span class="val">' +
            summary.delNo + '</span></div>';
        // RISK TYPE is kept as a plain static "OR" for now (not a selectable dropdown) --
        // a <select> control doesn't capture reliably into the PDF/print image.
        html += '<div class="summary-item"><span class="lbl">RISK TYPE :</span><span class="val">OR</span></div>';
        html += '</div>';
        html += '<div class="caption-row">' + caption + '</div>';
        return html;
    }

    // Builds one or two label/value cards for a summary row.
    function sRow(pair1, pair2){
        var out = '<div class="summary-item"><span class="lbl">' + pair1[0] + ' :</span><span class="val">' + (pair1[1] || "-") + '</span></div>';
        if (pair2){
            out += '<div class="summary-item"><span class="lbl">' + pair2[0] + ' :</span><span class="val">' + (pair2[1] || "-") + '</span></div>';
        }
        return out;
    }

    // Prefixes an amount with "Rs." -- leaves blank/"-" values untouched.
    function money(val){
        if (!val || val === "-") return "-";
        return "Rs. " + val;
    }

    // Shared by generateStatement() (screen/print/PDF/email) AND exportStatementExcel()
    // (spreadsheet) so both build the wagon list and summary the exact same way.
    function getWagonRowsAndSummary(d){
        // "wagonSummary" holds a JSON string like [{"RLY":"SE","TYPE":"BCNAM1","NO":"..."}].
        var wagonList = d.wagonSummary;
        if (typeof wagonList === "string"){
            try { wagonList = JSON.parse(wagonList); } catch (e){ wagonList = []; }
        }
        if (!Array.isArray(wagonList)) wagonList = [];
        var wagonRows = wagonList.map(function(w){
            return {
                rly: (w && (w.RLY || w.rly)) || "-",
                type: (w && (w.TYPE || w.type)) || "-",
                no: (w && (w.NO || w.no)) || "-"
            };
        });

        // deliveryNo already arrives fully formatted from the backend, e.g. "FOREIGN/1/1".
        var summary = {
            from: d.stationFrom || "-",
            to: d.stationTo || "-",
            wgn: d.wagonCount || "-",
            ivNo: d.invoiceNo || "-",
            ivDate: formatSheetDate(d.invoiceDate),
            awt: d.actualWt || "-",
            cnsr: d.consigner || "-",
            cnsg: d.consignee || "-",
            omm: d.commodityCode || "-",
            rNo: d.rrNumber || "-",
            rDt: formatSheetDate(d.rrDate),
            cwt: d.chargeWeight || "-",
            freight: d.freightExclGst || "-",
            gst: d.gst || "-",
            totalFreight: d.totalFreightInclGst || "-",
            lf: d.localForeign || "-",
            delNo: d.deliveryNo || "-",
            cls: d.deliveryClass || "-"
        };

        return { wagonRows: wagonRows, summary: summary };
    }

    function generateStatement(rec, idx){
        if (!rec) return;
        var d = rec.data;
        var parts = getWagonRowsAndSummary(d);
        var wagonRows = parts.wagonRows;
        var summary = parts.summary;

        var captions = [
            "INWARD NO. TAKER - COPY",
            "INWARD TALLY BOOK - COPY",
            "DELIVERY BOOK - COPY"
        ];

        var row = document.getElementById('sectionsRow');
        var html = '';
        captions.forEach(function(cap, i){
            if (i > 0){ html += '<div class="cut-mark"><span class="cut-line"></span><span class="scissor">&#9986;</span></div>'; }
            html += '<div class="section">' + buildSectionHTML(cap, wagonRows, summary) + '</div>';
        });
        row.innerHTML = html;

        statementWrap.style.display = "block";
        statementWrap.scrollIntoView({ behavior: "smooth" });
    }

    // Base filename shared by the PDF, Excel and Email flows for one rake --
    // "INV {INV NO.} {STATION FROM} {STATION TO} {RR DATE}", e.g.
    // "INV 01 BLZ HAPA 09-08-2026".
    function buildFileNameForRec(rec){
        var d = (rec && rec.data) ? rec.data : {};
        var inv = d.invoiceNo || '-';
        var from = d.stationFrom || '-';
        var to = d.stationTo || '-';
        var rrDate = formatSheetDateForFileName(d.rrDate);
        return 'INV ' + inv + ' ' + from + ' ' + to + ' ' + rrDate;
    }

    // A single shared "save this blob" helper -- lets the user choose a save
    // location via the File System Access API (where the browser supports it),
    // with a Save button in that dialog; otherwise falls back to <a download>,
    // saving straight to the browser's default Downloads folder.
    async function saveBlobToFile(blob, fileName, mimeType, pickerDescription, pickerExt){
        if (window.showSaveFilePicker) {
            try {
                var accept = {};
                accept[mimeType] = [pickerExt];
                var handle = await window.showSaveFilePicker({
                    suggestedName: fileName,
                    types: [{ description: pickerDescription, accept: accept }]
                });
                var writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                setStatus(fileName + ' has been saved.');
                return true;
            } catch (err) {
                if (err && err.name === 'AbortError') {
                    // The user cancelled the save dialog themselves -- not an error.
                    return false;
                }
                console.error('saveBlobToFile error:', err);
                setStatus('An error occurred while saving the file: ' + (err && err.message ? err.message : err), true);
                return false;
            }
        } else {
            // Fallback for browsers that don't support the File System Access API --
            // choosing a save location isn't possible there, so it goes to Downloads.
            try {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
                setStatus('Your browser does not support choosing a save location -- "' + fileName + '" has been saved to the default Downloads folder.');
                return true;
            } catch (err) {
                console.error('saveBlobToFile fallback error:', err);
                setStatus('An error occurred while downloading the file: ' + (err && err.message ? err.message : err), true);
                return false;
            }
        }
    }

    // Builds the PDF as bytes (no save, no download) from the on-screen a4 page --
    // used by both the PDF button and the Email flow so they share one PDF source.
    // The image is always scaled to fit within a single A4 landscape page -- if the
    // content would otherwise need 2 pages, it is shrunk (compressed) to fit on 1,
    // it is never split across pages.
    function generateStatementPdfBlob(rec, idx){
        return new Promise(function(resolve, reject){
            generateStatement(rec, idx);
            setTimeout(function(){
                var page = document.querySelector('.a4-page');
                if (!page || typeof html2canvas === 'undefined' || !window.jspdf){
                    reject(new Error('PDF library not loaded'));
                    return;
                }
                var fileName = buildFileNameForRec(rec) + '.pdf';
                html2canvas(page, { scale: 3, useCORS: true, backgroundColor: '#ffffff' }).then(function(canvas){
                    var imgData = canvas.toDataURL('image/jpeg', 0.98);
                    var jsPDF = window.jspdf.jsPDF;
                    var pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                    var pageW = pdf.internal.pageSize.getWidth();
                    var pageH = pdf.internal.pageSize.getHeight();
                    var imgRatio = canvas.height / canvas.width;
                    var w = pageW;
                    var h = w * imgRatio;
                    if (h > pageH){ h = pageH; w = h / imgRatio; }
                    var x = (pageW - w) / 2;
                    var y = (pageH - h) / 2;
                    pdf.addImage(imgData, 'JPEG', x, y, w, h);
                    resolve({ blob: pdf.output('blob'), fileName: fileName });
                }).catch(reject);
            }, 60);
        });
    }

    // PDF button -- generates the PDF, then lets the user pick where to save it
    // (a Save button confirms the save; no more silent auto-download).
    function downloadStatementPdf(rec, idx){
        if (!rec) return;
        generateStatementPdfBlob(rec, idx).then(function(result){
            return saveBlobToFile(result.blob, result.fileName, 'application/pdf', 'PDF Document', '.pdf');
        }).catch(function(err){
            console.error('downloadStatementPdf error:', err);
            setStatus('An error occurred while generating the PDF: ' + (err && err.message ? err.message : err), true);
        });
    }

    // Print icon -- builds the a4 statement for this rake, then goes straight to
    // the browser/OS print dialog (this is printing, not a "save", so no picker).
    function printStatement(rec, idx){
        if (!rec) return;
        generateStatement(rec, idx);
        setTimeout(function(){ window.print(); }, 60);
    }

    // Excel icon -- builds a workbook from the same wagon rows + summary as the
    // printed statement, then lets the user pick where to save it (same picker
    // flow as the PDF button).
    function exportStatementExcel(rec){
        if (!rec) return;
        if (typeof XLSX === 'undefined'){
            setStatus('Failed to load Excel library -- please check your internet connection.', true);
            return;
        }
        var parts = getWagonRowsAndSummary(rec.data);
        var wagonRows = parts.wagonRows;
        var summary = parts.summary;

        var wsData = [
            ['WAGON SUMMARY'],
            [summary.from + ' TO ' + summary.to],
            [],
            ['RR NUMBER : ' + summary.rNo, '', 'RR DATE : ' + summary.rDt],
            ['CONSIGNER : ' + summary.cnsr, '', 'CONSIGNEE : ' + summary.cnsg],
            ['INV. NO. : ' + summary.ivNo, '', 'INVOICE DATE : ' + summary.ivDate],
            ['NO. OF WAGONS : ' + summary.wgn],
            [],
            ['SR.', 'RLY', 'TYPE', 'NO.']
        ];
        wagonRows.forEach(function(w, i){
            wsData.push([i + 1, w.rly, w.type, shortNo(w.no)]);
        });

        var ws = XLSX.utils.aoa_to_sheet(wsData);
        ws['!cols'] = [{ wch: 6 }, { wch: 10 }, { wch: 14 }, { wch: 16 }];
        ws['!merges'] = [
            { s: { r: 0, c: 0 }, e: { r: 0, c: 3 } },
            { s: { r: 1, c: 0 }, e: { r: 1, c: 3 } }
        ];

        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Wagon Summary');
        var wbArray = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        var blob = new Blob([wbArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var fileName = buildFileNameForRec(rec) + '.xlsx';

        saveBlobToFile(blob, fileName, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'Excel Workbook', '.xlsx');
    }

    // ---------------- Email popup (recipient input -> PDF -> Apps Script -> Gmail) ----------------
    var currentEmailRec = null;
    var currentEmailIdx = null;

    function openEmailModal(rec, idx){
        if (!rec) return;
        currentEmailRec = rec;
        currentEmailIdx = idx;
        document.getElementById('emailToInput').value = '';
        document.getElementById('emailPasswordInput').value = '';
        document.getElementById('emailModalMsg').textContent = '';
        document.getElementById('emailSendBtn').disabled = false;
        document.getElementById('emailSendBtn').textContent = 'Send';
        document.getElementById('emailOverlay').style.display = 'flex';
        document.getElementById('emailToInput').focus();
    }
    function closeEmailModal(){
        document.getElementById('emailOverlay').style.display = 'none';
    }
    document.getElementById('emailCancelBtn').addEventListener('click', closeEmailModal);
    document.getElementById('emailOverlay').addEventListener('click', function(e){
        if (e.target === this) closeEmailModal();
    });

    // Blob -> base64 (without the data-URL prefix), so the Apps Script backend's
    // Utilities.base64Decode() can directly build the PDF bytes.
    function blobToBase64(blob){
        return new Promise(function(resolve, reject){
            var reader = new FileReader();
            reader.onloadend = function(){
                var result = reader.result; // "data:application/pdf;base64,...."
                resolve(result.substring(result.indexOf(',') + 1));
            };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    function isValidEmail(v){
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    // Same base Apps Script URL as the data feed above, without the listAll query
    // string -- the "action" for the email send is passed in the POST body instead.
    var EMAIL_API_URL = APPS_SCRIPT_URL.split('?')[0];
    var EMAIL_SEND_PASSWORD = "94976";

    async function sendEmailWithPdf(){
        var toEl = document.getElementById('emailToInput');
        var passEl = document.getElementById('emailPasswordInput');
        var msgEl = document.getElementById('emailModalMsg');
        var sendBtn = document.getElementById('emailSendBtn');
        var to = toEl.value.trim();

        if (!currentEmailRec){ msgEl.textContent = 'Please select a rake first.'; return; }
        if (passEl.value !== EMAIL_SEND_PASSWORD){ msgEl.textContent = 'Incorrect password.'; return; }
        if (!to || !isValidEmail(to)){ msgEl.textContent = 'Please enter a valid email address.'; return; }

        msgEl.textContent = '';
        sendBtn.disabled = true;
        sendBtn.textContent = 'Preparing PDF...';

        try {
            var result = await generateStatementPdfBlob(currentEmailRec, currentEmailIdx);
            sendBtn.textContent = 'Sending...';
            var pdfBase64 = await blobToBase64(result.blob);

            var resp = await fetch(EMAIL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
                body: JSON.stringify({
                    action: 'sendEmail',
                    to: to,
                    subject: result.fileName.replace(/\.pdf$/i, ''),
                    fileName: result.fileName,
                    pdfBase64: pdfBase64
                })
            });
            var res = await resp.json();
            if (res.status !== 'success'){
                throw new Error(res.message || 'Unknown error from server.');
            }
            closeEmailModal();
            showSuccessPopup('&#128231; Email sent to <strong>' + to + '</strong> &#9989;');
        } catch (err){
            console.error('sendEmailWithPdf error:', err);
            msgEl.textContent = 'An error occurred while sending the email: ' + (err && err.message ? err.message : err);
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
        }
    }
    document.getElementById('emailSendBtn').addEventListener('click', sendEmailWithPdf);

    function showSuccessPopup(msgHtml){
        document.getElementById('successMsg').innerHTML = msgHtml;
        document.getElementById('successOverlay').style.display = 'flex';
    }
    function hideSuccessPopup(){
        document.getElementById('successOverlay').style.display = 'none';
    }
    document.getElementById('successOkBtn').addEventListener('click', hideSuccessPopup);
    document.getElementById('successOverlay').addEventListener('click', function(e){
        if (e.target === this) hideSuccessPopup();
    });

    document.getElementById('submitBtn').addEventListener('click', submitFilter);
    document.getElementById('clearBtn').addEventListener('click', function(){
        document.getElementById('sectionsRow').innerHTML = '';
        statementWrap.style.display = 'none';
    });

    // Datalist inputs (Station From / Consignee) natively filter their option list
    // to only what's already typed -- so once a value is picked, reopening the list
    // shows just that one match. Clearing the field on focus keeps the full option
    // list available every time, and also lets the user blank the field out entirely
    // to remove the filter and see all data again.
    function enableFullDatalist(inputEl){
        inputEl.addEventListener('focus', function(){
            inputEl.value = "";
        });
    }
    enableFullDatalist(document.getElementById('stationFrom'));
    enableFullDatalist(document.getElementById('consigneeCode'));

    init();
</script>
</body>
