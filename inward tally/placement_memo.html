<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Memo - Goods Shed</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --navy-deep: #050b18;
  --navy: #0a1630;
  --navy-mid: #0f2148;
  --cyan: #00e5ff;
  --cyan-soft: #7ff5ff;
  --glass: rgba(255,255,255,0.05);
  --glass-border: rgba(0,229,255,0.25);
  --text: #eaf6ff;
  --text-dim: #8fa9c2;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: var(--text);
  padding: 28px 10px;
  background:
    radial-gradient(circle at 15% 10%, rgba(0,229,255,0.12), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(0,120,255,0.15), transparent 45%),
    linear-gradient(160deg, var(--navy-deep), var(--navy) 55%, var(--navy-mid));
  background-attachment: fixed;
}

#app {
  max-width: 640px;
  margin: auto;
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  padding: 22px 14px;
  border-radius: 20px;
  border: 1px solid var(--glass-border);
  box-shadow:
    0 8px 40px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.06),
    0 0 40px rgba(0,229,255,0.06);
}

h1 {
  text-align: center;
  color: var(--cyan-soft);
  letter-spacing: 2px;
  font-weight: 700;
  font-size: 17px;
  margin: 0 0 4px 0;
  text-shadow: 0 0 18px rgba(0,229,255,0.5);
}
.sub {
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 18px;
  letter-spacing: 0.3px;
}

.card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 12px 12px;
  margin-bottom: 14px;
}

.station-row {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  margin-bottom: 14px;
}
.station-row label {
  color: var(--cyan-soft);
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 1.2px;
}
.station-row select, .station-row input[type="date"] {
  padding: 8px 10px;
  border: 1px solid var(--glass-border);
  background: rgba(10,22,48,0.95);
  color: var(--text);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  min-width: 200px;
}
.station-row select:focus, .station-row input[type="date"]:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 12px rgba(0,229,255,0.35);
}
.station-row input[type="date"] { color-scheme: dark; }

/* ---------- Search / Filter card (rake search, styled like Print Wagon Summary) ---------- */
.filter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  align-items: end;
}
.filter-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.filter-field label {
  color: var(--cyan-soft);
  font-weight: 700;
  font-size: 10.5px;
  letter-spacing: 1px;
}
.filter-field input {
  padding: 8px 9px;
  border: 1px solid var(--glass-border);
  background: rgba(10,22,48,0.95);
  color: var(--text);
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 600;
  min-width: 0;
  width: 100%;
}
.filter-field input:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 10px rgba(0,229,255,0.35);
}
.filter-field input[type="date"] { color-scheme: dark; }
input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(70%) sepia(85%) saturate(4000%) hue-rotate(163deg) brightness(103%) contrast(101%);
    cursor: pointer;
}
#rakeSearchBtn {
  padding: 9px 10px;
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 12.5px;
  cursor: pointer;
  color: #001824;
  letter-spacing: 0.5px;
  background: linear-gradient(135deg, var(--cyan), #0090c8);
  box-shadow: 0 0 16px rgba(0,229,255,0.35);
  width: 100%;
}
#rakeSearchBtn:hover { box-shadow: 0 0 24px rgba(0,229,255,0.55); }
#rakeSearchBtn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

.search-status-msg { text-align: center; font-size: 12px; color: var(--text-dim); margin: 0 0 12px; }
.search-status-msg.error { color: #ff8f8f; }

/* ---------- Rake results table (search results, one row per rake) ---------- */
#rakeResultsCard { overflow: hidden; }
#rakeResultsCard .table-wrap { width: 100%; overflow-x: auto; }
.rake-results-table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
.rake-results-table thead th {
  background: rgba(0,229,255,0.1);
  color: var(--cyan-soft);
  text-align: center;
  padding: 6px 6px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  white-space: nowrap;
  border-bottom: 1px solid var(--glass-border);
}
.rake-results-table tbody td {
  padding: 5px 6px;
  text-align: center;
  border-bottom: 1px solid rgba(0,229,255,0.1);
  color: var(--text);
  white-space: nowrap;
}
.rake-results-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
.rake-select-btn {
  padding: 5px 12px;
  border: 1px solid rgba(0,229,255,0.35);
  background: linear-gradient(135deg, rgba(0,229,255,0.18), rgba(0,120,255,0.12));
  color: var(--cyan-soft);
  border-radius: 6px;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.4px;
  cursor: pointer;
}
.rake-select-btn:hover { background: linear-gradient(135deg, rgba(0,229,255,0.35), rgba(0,120,255,0.22)); }
.rake-results-table tbody tr.rake-row-selected { background: rgba(0,229,255,0.22) !important; }

/* The native <input type="date"> display format (MM/DD/YYYY vs DD/MM/YYYY) depends
   on the mobile device's locale and cannot be controlled directly via HTML/CSS.
   So we make the actual input's text transparent and overlay our own formatted
   "DD-MM-YYYY" text on top (updated via JS) — this keeps the format consistent
   regardless of the phone's language/region settings. */
.date-field-wrap { position: relative; display: inline-block; }
.date-field-wrap input[type="date"] {
  width: 100%;
  color: transparent;
}
.date-field-wrap input[type="date"]::-webkit-datetime-edit,
.date-field-wrap input[type="date"]::-webkit-datetime-edit-fields-wrapper,
.date-field-wrap input[type="date"]::-webkit-datetime-edit-text,
.date-field-wrap input[type="date"]::-webkit-datetime-edit-month-field,
.date-field-wrap input[type="date"]::-webkit-datetime-edit-day-field,
.date-field-wrap input[type="date"]::-webkit-datetime-edit-year-field {
  color: transparent;
}
.date-display {
  position: absolute;
  left: 0; top: 0; right: 26px; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  color: var(--text);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.3px;
}

.route-line {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: var(--text-dim);
  margin: -6px 0 14px 0;
}

.msg { font-size: 12.5px; padding: 8px 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid; }
.msg.error { background: rgba(255,60,60,0.1); color: #ff8f8f; border-color: rgba(255,60,60,0.35); }
.msg.info { background: rgba(0,229,255,0.08); color: var(--cyan-soft); border-color: var(--glass-border); }

.table-wrap {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  overflow-x: auto;
  margin-bottom: 14px;
}
/* table-layout: auto (not fixed) — so each column only takes as much space as
   its content needs, avoiding unnecessary empty gaps in between */
table { width: 100%; margin: 0; border-collapse: collapse; table-layout: auto; font-size: 10px; }
thead th {
  background: rgba(0,229,255,0.1);
  color: var(--cyan-soft);
  text-align: center;
  padding: 5px 5px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  white-space: nowrap;
  border-bottom: 1px solid var(--glass-border);
}
tbody td {
  padding: 3px 4px;
  text-align: center;
  border-bottom: 1px solid rgba(0,229,255,0.1);
  color: var(--text);
  white-space: nowrap;
}
tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
tbody tr.just-filled { background: rgba(0,229,255,0.22) !important; transition: background 0.2s ease; }

.pl-time-input, .line-select {
  padding: 3px 2px;
  border: 1px solid var(--glass-border);
  border-radius: 5px;
  font-size: 9.5px;
  text-align: center;
  color: var(--text);
  background: rgba(10,22,48,0.95);
}
/* TIME box only needs to fit 5 characters (HH:MM), LINE box only needs to fit
   "LOOSE-3" (the longest option) — both now have a fixed compact size and
   don't stretch the whole column */
.pl-time-input { width: 42px; }
.line-select { width: 66px; padding: 3px 1px; }
.pl-time-input:focus, .line-select:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 8px rgba(0,229,255,0.35);
}

/* Per-row DATE field — transparent text on the native date input (for the picker),
   with our own DD/MM/YY formatted text overlaid on top, kept compact like TIME/LINE. */
.row-date-wrap { position: relative; display: inline-block; width: 54px; }
.row-date-wrap input[type="date"] {
  width: 100%;
  padding: 3px 1px;
  border: 1px solid var(--glass-border);
  border-radius: 5px;
  font-size: 9.5px;
  text-align: center;
  color: transparent;
  background: rgba(10,22,48,0.95);
  color-scheme: dark;
}
.row-date-wrap input[type="date"]::-webkit-datetime-edit,
.row-date-wrap input[type="date"]::-webkit-datetime-edit-fields-wrapper,
.row-date-wrap input[type="date"]::-webkit-datetime-edit-text,
.row-date-wrap input[type="date"]::-webkit-datetime-edit-month-field,
.row-date-wrap input[type="date"]::-webkit-datetime-edit-day-field,
.row-date-wrap input[type="date"]::-webkit-datetime-edit-year-field {
  color: transparent;
}
.row-date-wrap input[type="date"]:focus {
  outline: none;
  border-color: var(--cyan);
  box-shadow: 0 0 8px rgba(0,229,255,0.35);
}
.row-date-display {
  position: absolute;
  left: 0; top: 0; right: 12px; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  color: var(--text);
  font-weight: 600;
  font-size: 9px;
}

.pltime-cell { display: flex; align-items: center; justify-content: center; gap: 2px; }
.filldown-btn {
  flex: 0 0 auto;
  width: 17px;
  height: 17px;
  padding: 0;
  line-height: 1;
  font-size: 8px;
  border: 1px solid rgba(0,229,255,0.35);
  background: linear-gradient(135deg, rgba(0,229,255,0.18), rgba(0,120,255,0.12));
  color: var(--cyan-soft);
  border-radius: 5px;
  cursor: pointer;
}
.filldown-btn:active { background: linear-gradient(135deg, rgba(0,229,255,0.4), rgba(0,120,255,0.25)); }

.col-sr   { color: var(--text-dim); font-weight: 700; }
.col-rly  { font-family: 'Consolas', monospace; }
.col-type { font-family: 'Consolas', monospace; letter-spacing: -0.2px; }
.col-no   { font-family: 'Consolas', monospace; letter-spacing: -0.2px; }

.submit-bar { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin-top: 4px; }
.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  background: linear-gradient(135deg, var(--cyan), #0090c8);
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  color: #001824;
  letter-spacing: 0.5px;
  box-shadow: 0 0 16px rgba(0,229,255,0.35);
}
.action-btn:hover { box-shadow: 0 0 24px rgba(0,229,255,0.55); }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
.btn-icon { font-size: 15px; line-height: 1; }
.email-btn { background: linear-gradient(135deg, #7ff5ff, #4aa9c9); }

/* ---------- Themed warning popup (future date/time) ---------- */
.warn-overlay {
  position: fixed;
  inset: 0;
  background: rgba(2,6,16,0.72);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 20px;
}
.warn-box {
  background: linear-gradient(160deg, var(--navy-deep), var(--navy) 60%, var(--navy-mid));
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 22px 20px;
  max-width: 320px;
  width: 100%;
  text-align: center;
  box-shadow: 0 10px 50px rgba(0,0,0,0.6), 0 0 40px rgba(0,229,255,0.15);
}
.warn-icon { font-size: 30px; color: var(--cyan); text-shadow: 0 0 14px rgba(0,229,255,0.6); margin-bottom: 6px; }
.warn-title { color: var(--cyan-soft); font-weight: 800; letter-spacing: 1.5px; font-size: 13px; margin-bottom: 10px; text-transform: uppercase; }
.warn-msg { color: var(--text); font-size: 13px; line-height: 1.55; margin-bottom: 18px; }
.warn-ok-btn {
  padding: 9px 28px;
  background: linear-gradient(135deg, var(--cyan), #0090c8);
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  color: #001824;
  cursor: pointer;
  box-shadow: 0 0 16px rgba(0,229,255,0.4);
}

/* ---------- Email popup extras (input + two-button row) ---------- */
.email-input {
  width: 100%;
  box-sizing: border-box;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid var(--glass-border);
  background: rgba(0,20,32,0.6);
  color: var(--text);
  font-size: 13px;
  outline: none;
  margin-bottom: 4px;
}
.email-input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,0.35); }
.email-modal-msg { min-height: 16px; font-size: 12px; color: #ff6b6b; margin: 6px 0 4px; text-align: left; }
.email-modal-btns { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
.email-cancel-btn { background: linear-gradient(135deg, #5a6b7a, #33414d); box-shadow: none; }
.warn-ok-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

/* ---------- Success popup (same cyan/navy theme, shown after a successful email send) ---------- */
.success-box { box-shadow: 0 10px 50px rgba(0,0,0,0.6), 0 0 55px rgba(0,229,255,0.22); }
.success-icon { font-size: 34px; }
.success-title { color: var(--cyan-soft); }
#successMsg { font-size: 14px; }

/* ---------- PRINT/PDF COPY CONTENT (shared by native print AND off-screen PDF capture) ---------- */
#printArea { display: none; }
/* When generating a PDF directly via the PDF button, this class renders
   printArea off-canvas (off-screen) at full size so html2canvas can capture
   it correctly — a display:none element cannot be screenshotted. */
#printArea.pdf-capture-mode {
    display: flex !important;
    position: fixed;
    left: -20000px;
    top: 0;
    width: 1200px;
    background: #fff;
    gap: 6mm;
}

.copy-block {
    flex: 1;
    border: 1px solid #000;
    padding: 3mm;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: #000 !important;
    background: #fff;
}
/* Both copies (CYM / CGS) print side-by-side on the same page and are later
   cut apart by hand — so we show a dashed cut-line to keep the cutting straight. */
.cut-line {
    flex: 0 0 auto;
    width: 0;
    border-left: 1.5px dashed #000 !important;
    align-self: stretch;
    position: relative;
}
.cut-line::before {
    content: "\2702";
    position: absolute;
    top: -4mm;
    left: 50%;
    transform: translateX(-50%) rotate(90deg);
    font-size: 9px;
    background: #fff;
    padding: 0 2px;
    color: #000 !important;
}
.copy-header-wrap { text-align: center; margin-bottom: 2px; }
/* "PLACEMENT MEMO" is now written in a black-background / bold-white box */
.copy-header-box {
    display: inline-block;
    background: #000 !important;
    color: #fff !important;
    font-weight: 800;
    letter-spacing: 1.2px;
    padding: 2px 12px;
    border-radius: 2px;
}
/* FROM/TO station is now shown without labels, directly in a distinct,
   comparatively larger font style like "MALB TO HAPA" — kept larger than
   PLACEMENT MEMO so the route stands out clearly */
.copy-route {
    text-align: center;
    font-weight: 800;
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 1.5px;
    margin: 6px 0 6px 0;
    color: #000 !important;
}
.copy-subcols { display: flex; gap: 2mm; }
.copy-subcols > div { flex: 1; min-width: 0; }
.copy-table { width: 100%; border-collapse: collapse; table-layout: fixed; color: #000 !important; }
.copy-table th, .copy-table td { border: 1px solid #000; text-align: center; overflow: hidden; white-space: nowrap; color: #000 !important; }
/* Header font size is the same as the data rows — distinguished only by bold + a light grey highlight */
.copy-table th { font-weight: 800; background: #d9d9d9 !important; }
.copy-footer { display: flex; justify-content: space-between; margin-top: 4px; color: #000 !important; }
.copy-label { text-align: center; font-weight: bold; margin-top: 5px; color: #000 !important; }

@media print {
    html, body { height: auto !important; margin: 0 !important; padding: 0 !important; background: #fff !important; }
    #app { display: none !important; }
    #printArea {
        display: flex !important;
        width: 100%;
        gap: 6mm;
    }
    @page { size: A4 landscape; margin: 6mm; }

    /* Ensures backgrounds print (header highlight) and text always stays pure
       black — unaffected by any browser/OS "dark print" mode */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
}
</style>
</head>
<body>

<div id="app">
    <h1>PLACEMENT MEMO</h1>

    <!-- ===== Rake Search / Filter (same idea as Print Wagon Summary's search bar) ===== -->
    <div class="card" id="rakeFilterCard">
        <div class="filter-grid">
            <div class="filter-field">
                <label for="rakeStationFrom">STATION FROM</label>
                <input list="rakeStationList" id="rakeStationFrom" placeholder="Type or select station">
                <datalist id="rakeStationList"></datalist>
            </div>
            <div class="filter-field">
                <label for="rakeConsignee">CONSIGNEE</label>
                <input list="rakeConsigneeList" id="rakeConsignee" placeholder="Type or select consignee">
                <datalist id="rakeConsigneeList"></datalist>
            </div>
            <div class="filter-field">
                <label for="rakeFromDate">RR DATE (FROM)</label>
                <input type="date" id="rakeFromDate" lang="en-GB">
            </div>
            <div class="filter-field">
                <label for="rakeToDate">RR DATE (TO)</label>
                <input type="date" id="rakeToDate" lang="en-GB">
            </div>
            <div class="filter-field">
                <label>&nbsp;</label>
                <button id="rakeSearchBtn" type="button" disabled>SEARCH</button>
            </div>
        </div>
    </div>

    <div class="search-status-msg" id="rakeSearchStatus">Data is Loading... Please Wait</div>

    <!-- ===== Rake search results (pick one to load into the memo below) ===== -->
    <div class="card" id="rakeResultsCard" style="display:none;">
        <div class="table-wrap">
            <table class="rake-results-table">
                <thead>
                    <tr>
                        <th>FROM</th>
                        <th>TO</th>
                        <th>WGN.</th>
                        <th>RR NUMBER</th>
                        <th>RR DATE</th>
                        <th>INV.</th>
                        <th>CONSIGNEE</th>
                        <th>SELECT</th>
                    </tr>
                </thead>
                <tbody id="rakeResultsBody"></tbody>
            </table>
        </div>
    </div>

    <div class="route-line" id="routeLine" style="display:none;"></div>

    <div id="msgBox"></div>

    <div class="table-wrap" id="tableWrap" style="display:none;">
        <table>
            <thead>
                <tr>
                    <th class="col-sr">Sr.</th>
                    <th class="col-rly">RLY</th>
                    <th class="col-type">TYPE</th>
                    <th class="col-no">NO.</th>
                    <th class="col-date">DATE</th>
                    <th class="col-pltime">TIME</th>
                    <th class="col-line">LINE</th>
                </tr>
            </thead>
            <tbody id="wagonTableBody"></tbody>
        </table>
    </div>

    <div class="submit-bar" id="submitBar" style="display:none;">
        <button class="action-btn" id="saveBtn" type="button"><span class="btn-icon">&#128190;</span> SAVE</button>
        <button class="action-btn" id="pdfBtn" type="button"><span class="btn-icon">&#128196;</span> PDF</button>
        <button class="action-btn" id="printBtn" type="button"><span class="btn-icon">&#128424;</span> PRINT</button>
        <button class="action-btn" id="excelBtn" type="button"><span class="btn-icon">&#128202;</span> EXCEL</button>
        <button class="action-btn email-btn" id="emailBtn" type="button"><span class="btn-icon">&#9993;</span> EMAIL</button>
    </div>
</div>

    <!-- Print-only content, built at submit time -->
    <div id="printArea"></div>

    <!-- Themed warning popup (future date / future time entries) -->
    <div class="warn-overlay" id="warnOverlay">
        <div class="warn-box">
            <div class="warn-icon">&#9888;</div>
            <div class="warn-title">Warning</div>
            <div class="warn-msg" id="warnMsg"></div>
            <button class="warn-ok-btn" id="warnOkBtn" type="button">OK</button>
        </div>
    </div>

    <!-- Email popup: takes the recipient's email, generates the PDF, and sends it
         via the Apps Script backend (authorized under the user's Gmail account) -->
    <div class="warn-overlay" id="emailOverlay">
        <div class="warn-box">
            <div class="warn-icon">&#9993;</div>
            <div class="warn-title">Send Email</div>
            <div class="warn-msg" style="text-align:left; margin-bottom:8px;">To (email address) :</div>
            <input type="email" id="emailToInput" class="email-input" placeholder="example@gmail.com" autocomplete="off">
            <div class="warn-msg" style="text-align:left; margin-bottom:8px;">Password :</div>
            <input type="password" id="emailPasswordInput" class="email-input" placeholder="Enter password" autocomplete="off">
            <div id="emailModalMsg" class="email-modal-msg"></div>
            <div class="email-modal-btns">
                <button class="warn-ok-btn email-cancel-btn" id="emailCancelBtn" type="button">Cancel</button>
                <button class="warn-ok-btn" id="emailSendBtn" type="button">Send</button>
            </div>
        </div>
    </div>

    <!-- Success popup (cyan/navy theme with emoji), shown once the email has been sent -->
    <div class="warn-overlay" id="successOverlay">
        <div class="warn-box success-box">
            <div class="warn-icon success-icon">&#127881;</div>
            <div class="warn-title success-title">Success</div>
            <div class="warn-msg" id="successMsg"></div>
            <button class="warn-ok-btn" id="successOkBtn" type="button">OK</button>
        </div>
    </div>

<script>
    // Rake list dropdown AND wagon detail lookup, both now come from the same source:
    // the iw_rake_data sheet, via its Apps Script backend.
    var RAKE_LIST_API_URL = "https://script.google.com/macros/s/AKfycby2hFOjiIlfK375_uBK3EQJ-_4KUwflq8AV3gmJtFjDGt-b-KhDm7avaq040OrxonTdTw/exec";
    // Email is deployed from a separate Apps Script project (placement_memo_email.gs),
    // so it has its own separate URL — unrelated to the rake data URL.
    var EMAIL_API_URL = "https://script.google.com/macros/s/AKfycby2hFOjiIlfK375_uBK3EQJ-_4KUwflq8AV3gmJtFjDGt-b-KhDm7avaq040OrxonTdTw/exec";
    var RAKE_LIST_SHEET_ID = "1kZF1pTmCnMcjMKwzLvxU6CMoyqkiBEGd2lWOYXSxo64";
    var RAKE_LIST_SHEET_NAME = "iw_rake_data";

    var MAX_WAGONS = 59;

    var LINE_OPTIONS = ["I/W", "O/W", "LOOSE-3"];
    var currentRakeData = null;
    var currentWagons = [];
    // Date/Time/Line values previously saved to the sheet for the currently
    // selected rake's wagons (see selectRakeRecord / renderTable / doSavePlacementData).
    var currentSavedPlacement = [];

    // All rake records fetched once on page load (any status — no status filter
    // applied here), plus the subset currently shown after a search.
    var allRakeRecords = [];
    var filteredRakeRecords = [];

    // Converts a row's date (yyyy-mm-dd, from the native <input type="date">) to
    // DD/MM/YY — shown in this format in both the screen table and the PDF
    // (takes up less space).
    function ddmmyyFromIso(iso) {
        if (!iso) return '';
        var p = iso.split('-'); // [yyyy, mm, dd]
        if (p.length !== 3) return '';
        return p[2] + '/' + p[1] + '/' + p[0].slice(2);
    }

    function pad2(n){ return n < 10 ? "0" + n : "" + n; }

    // Backend RR DATE values come through already-formatted as text (e.g.
    // "25/07/2026" or "22-07-2026", DD-then-MM-then-YYYY, separator varies).
    // Used for the search-results table and the RR Date range filter.
    function parseSheetDate(raw){
        if (!raw) return null;
        var parts = String(raw).trim().split(/[\/\-\.]/);
        if (parts.length !== 3) return null;
        var d = parseInt(parts[0], 10), m = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
        if (!d || !m || !y) return null;
        return new Date(y, m - 1, d);
    }
    function formatSheetDate(raw){
        var d = parseSheetDate(raw);
        return d ? (pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear()) : "-";
    }
    // The RR DATE (FROM/TO) filter fields are native <input type="date"> pickers,
    // which always hand back ISO "YYYY-MM-DD" — parsed separately since the
    // backend's DD/MM/YYYY text doesn't share the same separator order.
    function parseDatePickerValue(val){
        if (!val) return null;
        var parts = val.split("-");
        if (parts.length !== 3) return null;
        var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
        if (!y || !m || !d) return null;
        return new Date(y, m - 1, d);
    }

    function showMsg(text, type) {
        var box = document.getElementById('msgBox');
        box.innerHTML = '<div class="msg ' + (type || 'info') + '">' + text + '</div>';
    }
    function clearMsg() { document.getElementById('msgBox').innerHTML = ''; }

    function setSearchStatus(msg, isError){
        var el = document.getElementById('rakeSearchStatus');
        el.textContent = msg || "";
        el.className = "search-status-msg" + (isError ? " error" : "");
    }

    // ---------------- Themed (cyan/navy) warning popup ----------------
    function showWarningPopup(msg) {
        document.getElementById('warnMsg').textContent = msg;
        document.getElementById('warnOverlay').style.display = 'flex';
    }
    function hideWarningPopup() {
        document.getElementById('warnOverlay').style.display = 'none';
    }
    document.getElementById('warnOkBtn').addEventListener('click', hideWarningPopup);
    document.getElementById('warnOverlay').addEventListener('click', function (e) {
        if (e.target === this) hideWarningPopup();
    });

    // ---------------- Success popup (cyan/navy theme, shown after a successful email send) ----------------
    function showSuccessPopup(msgHtml) {
        document.getElementById('successMsg').innerHTML = msgHtml;
        document.getElementById('successOverlay').style.display = 'flex';
    }
    function hideSuccessPopup() {
        document.getElementById('successOverlay').style.display = 'none';
    }
    document.getElementById('successOkBtn').addEventListener('click', hideSuccessPopup);
    document.getElementById('successOverlay').addEventListener('click', function (e) {
        if (e.target === this) hideSuccessPopup();
    });

    // ---------------- Future date / future time validation ----------------
    // Today's date in "yyyy-mm-dd" format — kept in this format so it can be
    // directly string-compared with the <input type="date"> value format.
    function getTodayISODate() {
        var d = new Date();
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        var dd = String(d.getDate()).padStart(2, '0');
        return d.getFullYear() + '-' + mm + '-' + dd;
    }
    // Current time as "HH:MM" (24-hour, zero-padded) — pl-time-input is filled in
    // this same format, so a direct string-compare works.
    function getNowHHMM() {
        var d = new Date();
        var hh = String(d.getHours()).padStart(2, '0');
        var mi = String(d.getMinutes()).padStart(2, '0');
        return hh + ':' + mi;
    }

    // Future dates aren't allowed in any row — only today's date or an earlier date is valid.
    function validateRowDate(inputEl) {
        var today = getTodayISODate();
        if (inputEl.value && inputEl.value > today) {
            showWarningPopup('Future date is not allowed. You can only enter today\'s date (' + ddmmyyFromIso(today) + ') or an earlier date.');
            inputEl.value = '';
            updateRowDateDisplay(inputEl);
        }
    }

    // Time is only restricted when the row's date is "today" (or currently empty,
    // which we treat as today) — if the date is in the past, any time on that day
    // is allowed, regardless of the current clock time.
    function validateRowTime(rowEl) {
        var timeInput = rowEl.querySelector('.pl-time-input');
        var dateInput = rowEl.querySelector('.row-date-input');
        if (!timeInput || !timeInput.value || timeInput.value.length < 5) return;
        var rowDate = dateInput ? dateInput.value : '';
        var today = getTodayISODate();
        if (rowDate && rowDate !== today) return; // past date (future already blocked by validateRowDate) → no restriction on time
        var now = getNowHHMM();
        if (timeInput.value > now) {
            showWarningPopup('Future time is not allowed. The current time is ' + now + ' — for today\'s date you cannot enter a time later than this.');
            timeInput.value = '';
        }
    }

    // ---------------- Load all rake records once (no status filter -- every
    // record from the sheet is kept, regardless of status), then populate the
    // search datalists and show the initial (latest) results. ----------------
    function extractArray(json){
        if (Array.isArray(json)) return json;
        if (json && Array.isArray(json.records)) return json.records;
        if (json && Array.isArray(json.data)) return json.data;
        if (json && Array.isArray(json.rows)) return json.rows;
        if (json && Array.isArray(json.result)) return json.result;
        return [];
    }

    function fetchAllRakeRecords(){
        var url = RAKE_LIST_API_URL + "?action=listAll&sheetId=" + encodeURIComponent(RAKE_LIST_SHEET_ID) + "&sheetName=" + encodeURIComponent(RAKE_LIST_SHEET_NAME);
        return fetch(url).then(function (r) { return r.json(); }).then(function (res) {
            if (res && res.status === "error") throw new Error(res.message || "Backend error");
            var arr = extractArray(res);
            return arr;
        });
    }

    function populateRakeDatalists(){
        var stationSeen = {}, consigneeSeen = {};
        var stationList = document.getElementById('rakeStationList');
        var consigneeList = document.getElementById('rakeConsigneeList');
        stationList.innerHTML = "";
        consigneeList.innerHTML = "";
        allRakeRecords.forEach(function(rec){
            var s = pickField(rec, ['from', 'stationFrom', 'fromStation', 'FROM']);
            var c = pickField(rec, ['consignee', 'party', 'Consignee', 'CONSIGNEE']);
            if (s && !stationSeen[s]){ stationSeen[s] = true; var o1 = document.createElement('option'); o1.value = s; stationList.appendChild(o1); }
            if (c && !consigneeSeen[c]){ consigneeSeen[c] = true; var o2 = document.createElement('option'); o2.value = c; consigneeList.appendChild(o2); }
        });
    }

    function initRakeSearch(){
        setSearchStatus("Data is Loading... Please Wait");
        var btn = document.getElementById('rakeSearchBtn');
        btn.disabled = true;
        fetchAllRakeRecords().then(function (records) {
            allRakeRecords = records;
            populateRakeDatalists();
            if (records.length === 0) {
                setSearchStatus("No rakes found.", true);
            } else {
                setSearchStatus("Data loaded -- showing all rakes.");
                submitRakeSearch();
            }
            btn.disabled = false;
        }).catch(function (err) {
            setSearchStatus("Error loading data: " + err.message, true);
            btn.disabled = false;
        });
    }

    function renderRakeResults(records){
        var body = document.getElementById('rakeResultsBody');
        var card = document.getElementById('rakeResultsCard');
        body.innerHTML = "";
        if (records.length === 0) {
            card.style.display = "block";
            body.innerHTML = '<tr><td colspan="8">No matching rakes found.</td></tr>';
            return;
        }
        records.forEach(function (rec, idx) {
            var from = pickField(rec, ['from', 'stationFrom', 'fromStation', 'FROM']) || '-';
            var to = pickField(rec, ['to', 'stationTo', 'toStation', 'TO']) || '-';
            var wgnCount = pickField(rec, ['wagonCount']) || '-';
            var rrNumber = pickField(rec, ['rrNumber']) || '-';
            var rrDate = formatSheetDate(pickField(rec, ['rrDate']));
            var invNo = pickField(rec, ['invoiceNo', 'invoiceNumber', 'INVOICE_NO', 'invoice_no']) || '-';
            var consignee = pickField(rec, ['consignee', 'party', 'Consignee', 'CONSIGNEE']) || '-';

            var tr = document.createElement('tr');
            tr.innerHTML =
                '<td>' + from + '</td>' +
                '<td>' + to + '</td>' +
                '<td>' + wgnCount + '</td>' +
                '<td>' + rrNumber + '</td>' +
                '<td>' + rrDate + '</td>' +
                '<td>' + invNo + '</td>' +
                '<td>' + consignee + '</td>' +
                '<td><button type="button" class="rake-select-btn" data-idx="' + idx + '">SELECT</button></td>';
            body.appendChild(tr);
        });
        card.style.display = "block";

        body.querySelectorAll('.rake-select-btn').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var idx = parseInt(btn.getAttribute('data-idx'), 10);
                body.querySelectorAll('tr').forEach(function (r) { r.classList.remove('rake-row-selected'); });
                btn.closest('tr').classList.add('rake-row-selected');
                selectRakeRecord(filteredRakeRecords[idx]);
            });
        });
    }

    function submitRakeSearch(){
        var station = document.getElementById('rakeStationFrom').value.trim().toLowerCase();
        var consignee = document.getElementById('rakeConsignee').value.trim().toLowerCase();
        var fromD = parseDatePickerValue(document.getElementById('rakeFromDate').value);
        var toD = parseDatePickerValue(document.getElementById('rakeToDate').value);
        var noFiltersApplied = !station && !consignee && !fromD && !toD;

        filteredRakeRecords = allRakeRecords.filter(function (rec) {
            var recFrom = pickField(rec, ['from', 'stationFrom', 'fromStation', 'FROM']);
            var recConsignee = pickField(rec, ['consignee', 'party', 'Consignee', 'CONSIGNEE']);
            var recRrDate = pickField(rec, ['rrDate']);
            if (station && (!recFrom || String(recFrom).toLowerCase().indexOf(station) === -1)) return false;
            if (consignee && (!recConsignee || String(recConsignee).toLowerCase().indexOf(consignee) === -1)) return false;
            if ((fromD || toD) && recRrDate) {
                var rDate = parseSheetDate(recRrDate);
                if (rDate) {
                    if (fromD && rDate < fromD) return false;
                    if (toD && rDate > toD) return false;
                }
            }
            return true;
        });

        // Latest RR DATE first, oldest last.
        filteredRakeRecords.sort(function (a, b) {
            var da = parseSheetDate(pickField(a, ['rrDate']));
            var db = parseSheetDate(pickField(b, ['rrDate']));
            if (!da && !db) return 0;
            if (!da) return 1;
            if (!db) return -1;
            return db - da;
        });

        // With no filter applied (plain page load), only the latest 10 rakes are
        // shown so the table doesn't dump the entire sheet at once. Searching by
        // station, consignee, or an RR Date range shows the full matching set.
        var recordsToShow = noFiltersApplied ? filteredRakeRecords.slice(0, 10) : filteredRakeRecords;
        if (noFiltersApplied) filteredRakeRecords = recordsToShow;

        var count = recordsToShow.length;
        if (noFiltersApplied && allRakeRecords.length > recordsToShow.length) {
            setSearchStatus("Showing latest 10 of " + allRakeRecords.length + " rakes -- use the filters above to see older records.");
        } else {
            setSearchStatus("Record Found : " + (count < 10 ? "0" + count : count) + " Rake" + (count === 1 ? "" : "s"));
        }
        renderRakeResults(recordsToShow);
    }

    // ---------------- Select a rake from the search results (replaces the old dropdown selection) ----------------
    // Field names inside the data can vary (e.g. "from" or "stationFrom") — this
    // helper finds and returns the first non-empty value among the given candidate keys.
    function pickField(data, candidates) {
        for (var i = 0; i < candidates.length; i++) {
            var v = data[candidates[i]];
            if (v !== undefined && v !== null && v !== '') return v;
        }
        return '';
    }

    function selectRakeRecord(raw) {
        document.getElementById('routeLine').style.display = 'none';
        document.getElementById('tableWrap').style.display = 'none';
        document.getElementById('submitBar').style.display = 'none';
        clearMsg();
        if (!raw) return;

        // The wagonSummary value coming from the Google Sheet column is sometimes a
        // JSON *string* (rather than an already-parsed array/object). In that case,
        // calling .length directly on the string returns a character count (e.g. 2671)
        // instead of an array length — which was causing an incorrect "exceeds
        // MAX_WAGONS" error. So we parse it first, and if the parsed value itself
        // contains a "wagonSummary" key (meaning the whole JSON object ended up in
        // the column), we extract just that field.
        var wagonSummaryRaw = raw.wagonSummary || raw.WagonSummary || raw.wagon_summary || [];
        if (typeof wagonSummaryRaw === 'string') {
            try {
                var parsedWS = JSON.parse(wagonSummaryRaw);
                wagonSummaryRaw = (parsedWS && !Array.isArray(parsedWS) && parsedWS.wagonSummary)
                    ? parsedWS.wagonSummary
                    : parsedWS;
            } catch (e) {
                showMsg('Failed to parse wagonSummary field JSON: ' + e.message, 'error');
                wagonSummaryRaw = [];
            }
        } else if (wagonSummaryRaw && !Array.isArray(wagonSummaryRaw) && wagonSummaryRaw.wagonSummary) {
            // Already-parsed object but the full raw JSON object — extract the inner array from it
            wagonSummaryRaw = wagonSummaryRaw.wagonSummary;
        }

        currentRakeData = {
            rakeId: pickField(raw, ['rakeId', 'RakeId', 'RAKE_ID']),
            from: pickField(raw, ['from', 'stationFrom', 'fromStation', 'FROM']),
            to: pickField(raw, ['to', 'stationTo', 'toStation', 'TO']),
            wagonSummary: Array.isArray(wagonSummaryRaw) ? wagonSummaryRaw : [],
            // The actual field name in the sheet's JSON is "commodityCode", so it's
            // given first priority (the remaining candidates are kept as fallbacks).
            commodity: pickField(raw, ['commodityCode', 'CommodityCode', 'COMMODITY_CODE', 'commodity', 'Commodity', 'COMMODITY']),
            consignee: pickField(raw, ['consignee', 'party', 'Consignee', 'CONSIGNEE']),
            invoiceNo: pickField(raw, ['invoiceNo', 'invoiceNumber', 'INVOICE_NO', 'invoice_no'])
        };

        // Previously saved Date/Time/Line values for this rake's wagons (fed in
        // by the user earlier and stored back in the sheet) — if present, these
        // are used to pre-fill the table instead of leaving it blank. Stored as a
        // JSON string/array under "placementData", keyed by wagon NO where possible.
        currentSavedPlacement = [];
        var savedRaw = raw.placementData || raw.PlacementData || raw.placement_data || [];
        if (typeof savedRaw === 'string') {
            try { savedRaw = savedRaw ? JSON.parse(savedRaw) : []; } catch (e) { savedRaw = []; }
        }
        if (Array.isArray(savedRaw)) currentSavedPlacement = savedRaw;

        // FROM and TO both come from the sheet's data — TO station is never
        // hardcoded, whatever is in the sheet is shown as-is.
        var routeEl = document.getElementById('routeLine');
        routeEl.textContent = (currentRakeData.from || '-') + '  TO  ' + (currentRakeData.to || '-');
        routeEl.style.display = 'block';

        var wagons = currentRakeData.wagonSummary;
        if (!wagons || wagons.length === 0) {
            showMsg('Wagon summary data not found for this rake. Please check whether the "wagonSummary" field exists in the sheet\'s data.', 'error');
            return;
        }
        if (wagons.length > MAX_WAGONS) {
            showMsg('Wagon count (' + wagons.length + ') exceeds MAX_WAGONS (' + MAX_WAGONS + ').', 'error');
        }
        currentWagons = wagons;
        renderTable(wagons);
        document.getElementById('tableWrap').style.display = 'block';
        document.getElementById('submitBar').style.display = 'flex';
        document.getElementById('tableWrap').scrollIntoView({ behavior: 'smooth' });
    }

    function buildLineSelectHTML(rowIndex, savedLine) {
        var html = '<select class="line-select" data-row="' + rowIndex + '">';
        for (var i = 0; i < LINE_OPTIONS.length; i++) {
            var val = LINE_OPTIONS[i];
            var sel = (savedLine && savedLine === val) ? ' selected' : '';
            html += '<option value="' + val + '"' + sel + '>' + (val === "" ? "--" : val) + '</option>';
        }
        html += '</select>';
        return html;
    }

    // Looks up previously-saved placement data for wagon index i / wagon w --
    // matched first by wagon NO (most reliable, survives re-ordering), falling
    // back to matching by row index if no NO match is found.
    function findSavedPlacementFor(w, i) {
        if (!currentSavedPlacement || currentSavedPlacement.length === 0) return null;
        var no = (w && w.NO) ? String(w.NO).trim() : '';
        if (no) {
            for (var j = 0; j < currentSavedPlacement.length; j++) {
                var sp = currentSavedPlacement[j];
                if (sp && String(sp.no || sp.NO || '').trim() === no) return sp;
            }
        }
        return currentSavedPlacement[i] || null;
    }

    function renderTable(data) {
        var tbody = document.getElementById('wagonTableBody');
        var rowsHtml = '';
        for (var i = 0; i < data.length; i++) {
            var w = data[i];
            var saved = findSavedPlacementFor(w, i);
            var savedDate = saved ? (saved.date || saved.DATE || '') : '';
            var savedTime = saved ? (saved.time || saved.TIME || '') : '';
            var savedLine = saved ? (saved.line || saved.LINE || '') : '';
            rowsHtml += '<tr data-row="' + i + '">' +
                '<td class="col-sr">' + (i + 1) + '</td>' +
                '<td class="col-rly">' + (w.RLY || '') + '</td>' +
                '<td class="col-type">' + (w.TYPE || '') + '</td>' +
                '<td class="col-no">' + (w.NO || '') + '</td>' +
                '<td class="col-date">' +
                    '<div class="row-date-wrap">' +
                        '<input type="date" class="row-date-input" data-row="' + i + '" value="' + savedDate + '">' +
                        '<span class="row-date-display">' + (ddmmyyFromIso(savedDate) || 'DD/MM/YY') + '</span>' +
                    '</div>' +
                '</td>' +
                '<td class="col-pltime">' +
                    '<div class="pltime-cell">' +
                        '<input type="text" class="pl-time-input" data-row="' + i + '" placeholder="HH:MM" maxlength="5" value="' + savedTime + '">' +
                        '<button type="button" class="filldown-btn" data-row="' + i + '" title="Fill this value into all rows below">&#8681;</button>' +
                    '</div>' +
                '</td>' +
                '<td class="col-line">' + buildLineSelectHTML(i, savedLine) + '</td>' +
                '</tr>';
        }
        tbody.innerHTML = rowsHtml;
        attachFillDownHandlers();
        attachTimeFormatting();
        attachRowDateHandlers();
    }

    // Updates the DD/MM/YY display above the field as soon as the row's date input changes
    function updateRowDateDisplay(inputEl) {
        var disp = inputEl.parentNode.querySelector('.row-date-display');
        if (!disp) return;
        disp.textContent = ddmmyyFromIso(inputEl.value) || 'DD/MM/YY';
    }

    function attachRowDateHandlers() {
        var inputs = document.querySelectorAll('.row-date-input');
        inputs.forEach(function (inp) {
            inp.addEventListener('input', function () { updateRowDateDisplay(inp); });
            inp.addEventListener('change', function () {
                updateRowDateDisplay(inp);
                validateRowDate(inp);
                // Changing the date can also change whether it's past or today, so
                // re-check the time already filled in for that same row.
                var rowEl = inp.closest('tr');
                if (rowEl) validateRowTime(rowEl);
            });
        });
    }

    // Keeps Placement Time always in HH:MM format (digits only, colon auto-inserted)
    function formatTimeValue(raw) {
        var digits = raw.replace(/[^0-9]/g, '').slice(0, 4);
        if (digits.length <= 2) return digits;
        return digits.slice(0, 2) + ':' + digits.slice(2);
    }

    function attachTimeFormatting() {
        var inputs = document.querySelectorAll('.pl-time-input');
        inputs.forEach(function (inp) {
            inp.addEventListener('input', function () {
                inp.value = formatTimeValue(inp.value);
                if (inp.value.length === 5) {
                    var rowEl = inp.closest('tr');
                    if (rowEl) validateRowTime(rowEl);
                }
            });
        });
    }

    // Copies the current row's PL. TIME and LINE into all rows below it.
    // (The F7 key doesn't work on mobile, so each row has a small "fill-down"
    // button that does the same thing on tap.)
    function fillDownFrom(rowIndex) {
        var tbody = document.getElementById('wagonTableBody');
        var currentRowEl = tbody.querySelector('tr[data-row="' + rowIndex + '"]');
        if (!currentRowEl) return;
        var plTimeVal = currentRowEl.querySelector('.pl-time-input').value;
        var lineVal = currentRowEl.querySelector('.line-select').value;
        var dateVal = currentRowEl.querySelector('.row-date-input').value;

        var allRows = tbody.querySelectorAll('tr');
        allRows.forEach(function (rowEl) {
            var idx = parseInt(rowEl.getAttribute('data-row'), 10);
            if (idx >= rowIndex) {
                rowEl.querySelector('.pl-time-input').value = plTimeVal;
                rowEl.querySelector('.line-select').value = lineVal;
                var dInput = rowEl.querySelector('.row-date-input');
                dInput.value = dateVal;
                updateRowDateDisplay(dInput);
                rowEl.classList.add('just-filled');
                setTimeout(function (r) { return function () { r.classList.remove('just-filled'); }; }(rowEl), 600);
            }
        });
    }

    function attachFillDownHandlers() {
        var tbody = document.getElementById('wagonTableBody');

        // Tap/click to fill down (for mobile) — button.filldown-btn
        tbody.addEventListener('click', function (e) {
            var btn = e.target.closest ? e.target.closest('.filldown-btn') : null;
            if (!btn) return;
            var rowIndex = parseInt(btn.getAttribute('data-row'), 10);
            if (isNaN(rowIndex)) return;
            fillDownFrom(rowIndex);
        });

        // F7 still works too, for physical keyboards (desktop)
        tbody.addEventListener('keydown', function (e) {
            if (e.key !== 'F7') return;
            e.preventDefault();
            var rowIndex = parseInt(e.target.getAttribute('data-row'), 10);
            if (isNaN(rowIndex)) return;
            fillDownFrom(rowIndex);
        });
    }

    // ---------------- Build print copy + trigger print ----------------

    // Maximum rows to show per sub-column (like the sample PDF, 1-30 and 31-59 side by side).
    var ROWS_PER_SUBCOL = 30;

    // A single fixed compact scale — since each sub-column now holds a max of 30
    // rows (whether the wagon count is 5 or 59), the font never needs to shrink much.
    // headFont is kept the SAME as the data font — the header is distinguished only
    // by bold + a light grey highlight (.copy-table th CSS), not by a larger size.
    function computeScale() {
        // routeFont (for a route line like "MALB TO HAPA") is deliberately kept
        // larger than labelFont (PLACEMENT MEMO), so the route stands out clearly.
        return { font: 8.3, pad: "1.4px 3px", headFont: 8.3, labelFont: 9.5, routeFont: 14, footFont: 9 };
    }

    // Shows only the last 6 digits/characters of the full wagon number (to save space)
    function last6(no) {
        no = (no || '').toString().trim();
        return no.length > 6 ? no.slice(-6) : no;
    }

    function buildCopyHTML(copyLabel, scale) {
        var tbody = document.getElementById('wagonTableBody');
        var rows = tbody.querySelectorAll('tr');

        var rowsData = [];
        rows.forEach(function (rowEl) {
            rowsData.push({
                sr: rowEl.querySelector('.col-sr').textContent,
                rly: rowEl.querySelector('.col-rly').textContent,
                type: rowEl.querySelector('.col-type').textContent,
                no: last6(rowEl.querySelector('.col-no').textContent),
                date: ddmmyyFromIso(rowEl.querySelector('.row-date-input').value),
                plTime: rowEl.querySelector('.pl-time-input').value,
                line: rowEl.querySelector('.line-select').value
            });
        });

        // Splits rowsData into chunks of 30, so each chunk goes into its own sub-column
        var chunks = [];
        for (var i = 0; i < rowsData.length; i += ROWS_PER_SUBCOL) {
            chunks.push(rowsData.slice(i, i + ROWS_PER_SUBCOL));
        }
        if (chunks.length === 0) chunks.push([]);

        var subcolsHtml = '';
        chunks.forEach(function (chunk) {
            var rowsHtml = '';
            chunk.forEach(function (r) {
                rowsHtml += '<tr>' +
                    '<td style="padding:' + scale.pad + ';">' + r.sr + '</td>' +
                    '<td style="padding:' + scale.pad + ';">' + r.rly + '</td>' +
                    '<td style="padding:' + scale.pad + ';">' + r.type + '</td>' +
                    '<td style="padding:' + scale.pad + ';">' + r.no + '</td>' +
                    '<td style="padding:' + scale.pad + ';">' + r.line + '</td>' +
                    '<td style="padding:' + scale.pad + ';">' + r.date + '</td>' +
                    '<td style="padding:' + scale.pad + ';">' + r.plTime + '</td>' +
                    '</tr>';
            });
            subcolsHtml += '<div>' +
                '<table class="copy-table" style="font-size:' + scale.font + 'px;">' +
                    '<thead><tr style="font-size:' + scale.headFont + 'px;">' +
                        '<th style="padding:' + scale.pad + '; width:8%;">NO.</th><th style="padding:' + scale.pad + '; width:11%;">RLY</th>' +
                        '<th style="padding:' + scale.pad + '; width:14%;">TYPE</th><th style="padding:' + scale.pad + '; width:14%;">WGN.</th>' +
                        '<th style="padding:' + scale.pad + '; width:14%;">LINE</th><th style="padding:' + scale.pad + '; width:20%;">DATE</th>' +
                        '<th style="padding:' + scale.pad + '; width:19%;">TIME</th>' +
                    '</tr></thead>' +
                    '<tbody>' + rowsHtml + '</tbody>' +
                '</table>' +
                '</div>';
        });

        var commodity = currentRakeData ? (currentRakeData.commodity || '') : '';
        var party = currentRakeData ? (currentRakeData.consignee || '') : '';
        // TO STATION is also always taken from the sheet's data (column E), never hardcoded.
        var toStation = currentRakeData ? (currentRakeData.to || '') : '';

        var fromStation = currentRakeData ? (currentRakeData.from || '') : '';

        return '<div class="copy-block">' +
            '<div class="copy-header-wrap"><span class="copy-header-box" style="font-size:' + scale.labelFont + 'px;">PLACEMENT MEMO</span></div>' +
            '<div class="copy-route" style="font-size:' + scale.routeFont + 'px;">' + fromStation + ' TO ' + toStation + '</div>' +
            '<div class="copy-subcols">' + subcolsHtml + '</div>' +
            '<div class="copy-footer" style="font-size:' + scale.footFont + 'px;">' +
                '<span>NAME OF PARTY : ' + party + '</span>' +
                '<span>COMMODITY : ' + commodity + '</span>' +
            '</div>' +
            '<div class="copy-label" style="font-size:' + scale.labelFont + 'px;">' + copyLabel + ' - COPY</div>' +
            '</div>';
    }

    // When using "Save as PDF", the browser's print dialog takes its default
    // filename from document.title, so we set the title to the required name
    // before printing. There's no global Placement Date field anymore — for the
    // filename we use the date from the first row that has one filled in,
    // otherwise today's date.
    function pickFilenameIsoDate() {
        var inputs = document.querySelectorAll('.row-date-input');
        for (var i = 0; i < inputs.length; i++) {
            if (inputs[i].value) return inputs[i].value; // yyyy-mm-dd
        }
        var today = new Date();
        var mm = String(today.getMonth() + 1).padStart(2, '0');
        var dd = String(today.getDate()).padStart(2, '0');
        return today.getFullYear() + '-' + mm + '-' + dd;
    }

    function isoToDDMMYYYY(iso) {
        var p = iso.split('-');
        if (p.length !== 3) return iso;
        return p[2] + '-' + p[1] + '-' + p[0];
    }

    function buildPdfFileName() {
        var inv = (currentRakeData && currentRakeData.invoiceNo) ? currentRakeData.invoiceNo : '';
        var from = (currentRakeData && currentRakeData.from) ? currentRakeData.from : '';
        var to = (currentRakeData && currentRakeData.to) ? currentRakeData.to : '';
        var dateVal = isoToDDMMYYYY(pickFilenameIsoDate());
        // Removed the Sr. no. ("01 ") prefix — the filename now starts directly with "INV ...".
        return 'INV ' + inv + ' ' + from + ' - ' + to + ' ' + dateVal + ' - PLACEMENT MEMO';
    }

    // A single shared "save this blob" helper — lets the user choose a save
    // location via the File System Access API (where the browser supports it);
    // otherwise falls back to <a download>, saving to the browser's default
    // Downloads folder. Shows a clear success/failure message in both cases
    // (some errors used to be silently ignored before — now every real error is shown).
    async function saveBlobToFile(blob, fileName, mimeType, pickerDescription, pickerExt) {
        if (window.showSaveFilePicker) {
            try {
                var accept = {};
                accept[mimeType] = [pickerExt];
                var handle = await window.showSaveFilePicker({
                    suggestedName: fileName,
                    types: [{ description: pickerDescription, accept: accept }]
                });
                var writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                showMsg(fileName + ' has been saved.', 'info');
                return true;
            } catch (err) {
                if (err && err.name === 'AbortError') {
                    // The user cancelled the save dialog themselves — this is not an error.
                    return false;
                }
                console.error('saveBlobToFile error:', err);
                showMsg('An error occurred while saving the file: ' + (err && err.message ? err.message : err) + '. If this page is open inside an app/preview (embedded webview), please open it directly in your Chrome/Edge browser tab and try again.', 'error');
                return false;
            }
        } else {
            // Fallback for browsers that don't support the File System Access API
            // (e.g. Firefox, Safari, or mobile browsers) — in this case choosing a
            // save location isn't possible, the file goes straight to the default
            // Downloads folder.
            try {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
                showMsg('Your browser does not support choosing a save location — "' + fileName + '" has been saved to the default Downloads folder.', 'info');
                return true;
            } catch (err) {
                console.error('saveBlobToFile fallback error:', err);
                showMsg('An error occurred while downloading the file: ' + (err && err.message ? err.message : err), 'error');
                return false;
            }
        }
    }

    // Common prep: validate a rake is selected, warn about empty cells, and build
    // the two print-copy blocks (with a cut-line between them) into #printArea.
    // Returns false if nothing was prepared (so the caller should stop).
    function prepareCopies() {
        clearMsg();
        if (!currentRakeData) { showMsg('Please select a Rake ID first.', 'error'); return false; }

        var rows = document.querySelectorAll('#wagonTableBody tr');
        var incomplete = false;
        rows.forEach(function (rowEl) {
            var plTime = rowEl.querySelector('.pl-time-input').value.trim();
            var line = rowEl.querySelector('.line-select').value;
            var dateV = rowEl.querySelector('.row-date-input').value;
            if (!plTime || !line || !dateV) incomplete = true;
        });
        if (incomplete) {
            showMsg('Date, PL. Time or Line No. is empty in some rows. Those cells will be left blank.', 'info');
        }

        var scale = computeScale();
        var printArea = document.getElementById('printArea');
        printArea.innerHTML = buildCopyHTML('CYM', scale) + '<div class="cut-line"></div>' + buildCopyHTML('CGS', scale);
        return true;
    }

    // PDF generation no longer depends on window.print()'s native "Save as PDF"
    // dialog (which doesn't save reliably on many devices/embedded webviews) —
    // instead we build a real PDF file (bytes) ourselves (via html2canvas + jsPDF)
    // and save it using the same reliable save-dialog flow as Excel.
    // generatePdfBlob() only builds/returns the PDF bytes (no save, no download) —
    // this lets both the PDF button and the Email button get their PDF from one place.
    async function generatePdfBlob() {
        if (!prepareCopies()) return null;
        if (typeof html2canvas === 'undefined' || !window.jspdf) {
            showMsg('Failed to load PDF library — please check your internet connection.', 'error');
            return null;
        }

        var printArea = document.getElementById('printArea');
        printArea.classList.add('pdf-capture-mode');
        try {
            var canvas = await html2canvas(printArea, { scale: 2, backgroundColor: '#ffffff' });
            var imgData = canvas.toDataURL('image/png');

            var jsPDF = window.jspdf.jsPDF;
            var pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
            var pageW = pdf.internal.pageSize.getWidth();
            var pageH = pdf.internal.pageSize.getHeight();
            var imgRatio = canvas.height / canvas.width;
            var w = pageW;
            var h = w * imgRatio;
            if (h > pageH) { h = pageH; w = h / imgRatio; }
            var x = (pageW - w) / 2;
            var y = (pageH - h) / 2;
            pdf.addImage(imgData, 'PNG', x, y, w, h);

            var blob = pdf.output('blob');
            var fileName = buildPdfFileName() + '.pdf';
            return { blob: blob, fileName: fileName };
        } catch (err) {
            console.error('generatePdfBlob error:', err);
            showMsg('An error occurred while generating the PDF: ' + (err && err.message ? err.message : err), 'error');
            return null;
        } finally {
            printArea.classList.remove('pdf-capture-mode');
        }
    }

    async function doGeneratePDF() {
        showMsg('Preparing PDF...', 'info');
        var result = await generatePdfBlob();
        if (!result) return;
        await saveBlobToFile(result.blob, result.fileName, 'application/pdf', 'PDF Document', '.pdf');
    }

    // The Print button goes straight to the OS/browser print dialog (for sending
    // to a printer) — this is not a "save" action, so it's kept separate from the PDF button.
    function doPrint() {
        if (!prepareCopies()) return;
        var originalTitle = document.title;
        document.title = buildPdfFileName();
        var restoreTitle = function () {
            document.title = originalTitle;
            window.removeEventListener('afterprint', restoreTitle);
        };
        window.addEventListener('afterprint', restoreTitle);
        window.print();
    }

    // Collects the wagon table's data into rows for the Excel export
    // (directly from the screen table, so whatever is filled in gets exported).
    function buildWagonRowsForExport() {
        var tbody = document.getElementById('wagonTableBody');
        var rows = tbody.querySelectorAll('tr');
        var data = [];
        rows.forEach(function (rowEl) {
            data.push([
                rowEl.querySelector('.col-sr').textContent,
                rowEl.querySelector('.col-rly').textContent,
                rowEl.querySelector('.col-type').textContent,
                rowEl.querySelector('.col-no').textContent,
                ddmmyyFromIso(rowEl.querySelector('.row-date-input').value),
                rowEl.querySelector('.pl-time-input').value,
                rowEl.querySelector('.line-select').value
            ]);
        });
        return data;
    }

    // Excel export also lets the user choose the save location themselves (via
    // the File System Access API, where the browser supports it) — not an auto-download.
    async function doExportExcel() {
        clearMsg();
        if (!currentRakeData) { showMsg('Please select a Rake ID first.', 'error'); return; }
        if (typeof XLSX === 'undefined') { showMsg('Failed to load Excel library — please check your internet connection.', 'error'); return; }

        var party = currentRakeData.consignee || '';
        var commodity = currentRakeData.commodity || '';
        var route = (currentRakeData.from || '') + ' TO ' + (currentRakeData.to || '');

        // Party/Commodity are written as "LABEL : value" in a single cell (instead of
        // separate label/value cells) — so the text never gets cut off even at a
        // smaller column width, regardless of whether the next cell is empty.
        var wsData = [
            ['PLACEMENT MEMO'],
            [route],
            [],
            ['NAME OF PARTY : ' + party, '', '', '', 'COMMODITY : ' + commodity],
            [],
            ['NO', 'RLY', 'TYPE', 'WGN NO', 'DATE', 'TIME', 'LINE']
        ];
        wsData = wsData.concat(buildWagonRowsForExport());

        var ws = XLSX.utils.aoa_to_sheet(wsData);

        // Give each column enough width that no header/label/value is ever
        // truncated/overlapped (WGN NO is sized for the longest wagon numbers).
        ws['!cols'] = [
            { wch: 6 },   // NO
            { wch: 8 },   // RLY
            { wch: 12 },  // TYPE
            { wch: 16 },  // WGN NO
            { wch: 12 },  // DATE
            { wch: 8 },   // TIME
            { wch: 10 }   // LINE
        ];

        // Merged the title / route / party-commodity rows across the full width (7
        // columns), so they appear centered as a continuous line, with the text
        // never cut off at a column border.
        ws['!merges'] = [
            { s: { r: 0, c: 0 }, e: { r: 0, c: 6 } }, // PLACEMENT MEMO
            { s: { r: 1, c: 0 }, e: { r: 1, c: 6 } }, // MALB TO HAPA
            { s: { r: 3, c: 0 }, e: { r: 3, c: 3 } }, // NAME OF PARTY : ...
            { s: { r: 3, c: 4 }, e: { r: 3, c: 6 } }  // COMMODITY : ...
        ];

        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Placement Memo');
        var wbArray = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        var blob = new Blob([wbArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var fileName = buildPdfFileName() + '.xlsx';

        await saveBlobToFile(blob, fileName, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', 'Excel Workbook', '.xlsx');
    }

    // ---------------- Save the entered Date/Time/Line back to the Google Sheet ----------------
    // Collects one entry per wagon row (NO, RLY, TYPE, date in ISO, time, line) and
    // POSTs it to the backend so it's stored against this rake -- so that reopening
    // the same Rake ID later re-shows exactly what was fed in, instead of blank fields.
    // NOTE: this calls a new backend action "savePlacementData" which must be added
    // to the Apps Script project (see the note given alongside this file).
    function buildPlacementDataForSave() {
        var tbody = document.getElementById('wagonTableBody');
        var rows = tbody.querySelectorAll('tr');
        var out = [];
        rows.forEach(function (rowEl) {
            out.push({
                no: rowEl.querySelector('.col-no').textContent,
                rly: rowEl.querySelector('.col-rly').textContent,
                type: rowEl.querySelector('.col-type').textContent,
                date: rowEl.querySelector('.row-date-input').value, // ISO yyyy-mm-dd
                time: rowEl.querySelector('.pl-time-input').value,
                line: rowEl.querySelector('.line-select').value
            });
        });
        return out;
    }

    async function doSavePlacementData() {
        clearMsg();
        if (!currentRakeData) { showMsg('Please select a Rake ID first.', 'error'); return; }
        if (!currentRakeData.rakeId) {
            showMsg('This rake record has no Rake ID, so the saved data cannot be matched back to a sheet row.', 'error');
            return;
        }

        var saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        var originalHtml = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="btn-icon">&#128190;</span> Saving...';

        var placementData = buildPlacementDataForSave();
        try {
            var resp = await fetch(RAKE_LIST_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
                body: JSON.stringify({
                    action: 'savePlacementData',
                    sheetId: RAKE_LIST_SHEET_ID,
                    sheetName: RAKE_LIST_SHEET_NAME,
                    rakeId: currentRakeData.rakeId,
                    placementData: placementData
                })
            });
            var res = await resp.json();
            if (res.status !== 'success') {
                throw new Error(res.message || 'Unknown error from server.');
            }
            currentSavedPlacement = placementData;
            showMsg('Data Saved Successfully !!!', 'info');
        } catch (err) {
            console.error('doSavePlacementData error:', err);
            showMsg('An error occurred while saving: ' + (err && err.message ? err.message : err), 'error');
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerHTML = originalHtml;
        }
    }
    document.getElementById('saveBtn').addEventListener('click', doSavePlacementData);

    // ---------------- Email popup (recipient input -> PDF -> Apps Script -> Gmail) ----------------
    function openEmailModal() {
        if (!currentRakeData) { showMsg('Please select a Rake ID first.', 'error'); return; }
        document.getElementById('emailToInput').value = '';
        document.getElementById('emailPasswordInput').value = '';
        document.getElementById('emailModalMsg').textContent = '';
        document.getElementById('emailSendBtn').disabled = false;
        document.getElementById('emailSendBtn').textContent = 'Send';
        document.getElementById('emailOverlay').style.display = 'flex';
        document.getElementById('emailToInput').focus();
    }
    function closeEmailModal() {
        document.getElementById('emailOverlay').style.display = 'none';
    }
    document.getElementById('emailCancelBtn').addEventListener('click', closeEmailModal);
    document.getElementById('emailOverlay').addEventListener('click', function (e) {
        if (e.target === this) closeEmailModal();
    });

    // Blob -> base64 (without the data-URL prefix), so the Apps Script backend's
    // Utilities.base64Decode() can directly build the PDF bytes.
    function blobToBase64(blob) {
        return new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onloadend = function () {
                var result = reader.result; // "data:application/pdf;base64,...."
                resolve(result.substring(result.indexOf(',') + 1));
            };
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    function isValidEmail(v) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    var EMAIL_SEND_PASSWORD = "94976";

    async function sendEmailWithPdf() {
        var toEl = document.getElementById('emailToInput');
        var passEl = document.getElementById('emailPasswordInput');
        var msgEl = document.getElementById('emailModalMsg');
        var sendBtn = document.getElementById('emailSendBtn');
        var to = toEl.value.trim();

        if (passEl.value !== EMAIL_SEND_PASSWORD) {
            msgEl.textContent = 'Incorrect password.';
            return;
        }
        if (!to || !isValidEmail(to)) {
            msgEl.textContent = 'Please enter a valid email address.';
            return;
        }
        msgEl.textContent = '';
        sendBtn.disabled = true;
        sendBtn.textContent = 'Preparing PDF...';

        var result = await generatePdfBlob();
        if (!result) {
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
            return;
        }

        try {
            sendBtn.textContent = 'Sending...';
            var pdfBase64 = await blobToBase64(result.blob);

            var resp = await fetch(EMAIL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
                body: JSON.stringify({
                    action: 'sendEmail',
                    to: to,
                    subject: result.fileName.replace(/\.pdf$/i, ''),
                    fileName: result.fileName,
                    pdfBase64: pdfBase64
                })
            });
            var res = await resp.json();
            if (res.status !== 'success') {
                throw new Error(res.message || 'Unknown error from server.');
            }
            closeEmailModal();
            showSuccessPopup('&#128231; Email sent to <strong>' + to + '</strong> &#9989;');
        } catch (err) {
            console.error('sendEmailWithPdf error:', err);
            msgEl.textContent = 'An error occurred while sending the email: ' + (err && err.message ? err.message : err);
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
        }
    }
    document.getElementById('emailSendBtn').addEventListener('click', sendEmailWithPdf);

    document.getElementById('rakeSearchBtn').addEventListener('click', submitRakeSearch);
    document.getElementById('pdfBtn').addEventListener('click', doGeneratePDF);
    document.getElementById('printBtn').addEventListener('click', doPrint);
    document.getElementById('excelBtn').addEventListener('click', doExportExcel);
    document.getElementById('emailBtn').addEventListener('click', openEmailModal);

    // Datalist inputs (Station From / Consignee) natively filter their option list
    // to only what's already typed — clearing the field on focus keeps the full
    // option list available every time, and also lets the user blank the field
    // out entirely to remove that part of the filter.
    function enableFullDatalist(inputEl){
        inputEl.addEventListener('focus', function(){
            inputEl.value = "";
        });
    }
    enableFullDatalist(document.getElementById('rakeStationFrom'));
    enableFullDatalist(document.getElementById('rakeConsignee'));

    initRakeSearch();
</script>
